sound_player: 
  play_sfx_combo: 
    sfx_combo: 
      key: key_sfx_combo
      action: play
  stop_sfx_combo: 
    sfx_combo: 
      key: key_sfx_combo
      action: stop


timers: 
  combos:
    start_value: 0
    end_value: current_player.combo_ticks
    direction: up
    control_events: 
      - event: restart_c_timer
        action: restart
    restart_on_complete: False
    start_running: False
    tick_interval: 1000ms
  decay_combos:
    start_value: 0
    end_value: current_player.combo_decay_ticks
    direction: up
    control_events: 
      - event: restart_decay_timer
        action: restart
      - event: restart_c_timer
        action: stop
    restart_on_complete: False
    start_running: False
    tick_interval: 200ms

variable_player: 
  reset_combos: 
    combos_value: 
      action: set
      int: 0

  add_combos: 
    combos_value: 
      action: add
      int: 1

  subtract_combos: 
    combos_value: 
      action: add
      int: -1

  mystery_relaxed_combos: 
    combo_ticks: 
      action: set
      int: 11
    combo_decay_ticks: 
      action: set
      int: 7

  clear_relaxed_combos: 
    combo_ticks: 
      action: set
      int: 7
    combo_decay_ticks: 
      action: set
      int: 4




