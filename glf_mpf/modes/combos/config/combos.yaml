#config_version=6

mode:
  start_events: new_ball_started, stop_meteor_wave, training_stopped, wizard_mode_ended
  stop_events: stop_combos, mode_base_stopping, init_training, wizard_mode_started
  priority: 530

event_player: 
  mode_combos_started:
    - reset_combos
  mode_combos_started{current_player.ball_just_started==1}:
    - clear_relaxed_combos
  timer_combos_complete:
    - restart_decay_timer
    - check_subtract_combos
  timer_decay_combos_complete:
    - check_subtract_combos
  left_side_hit:
    - restart_c_timer
    - check_add_combos
  left_orbit_hit:
    - restart_c_timer
    - check_add_combos
  left_ramp_hit:
    - restart_c_timer
    - check_add_combos
  inner_orbit_hit:
    - restart_c_timer
    - check_add_combos
  center_orbit_left_hit:
    - restart_c_timer
    - check_add_combos
  center_orbit_right_hit:
    - restart_c_timer
    - check_add_combos
  right_ramp_hit:
    - restart_c_timer
    - check_add_combos
  right_orbit_hit:
    - restart_c_timer
    - check_add_combos
  check_add_combos{current_player.combos_value==0}:
    - add_combos
  check_add_combos{current_player.combos_value==1}:
    - combos1_lit
    - add_combos
    - replay_sfx_combo
    - flash_combos
    - score_2000
  check_add_combos{current_player.combos_value==2}:
    - combos2_lit
    - add_combos
    - replay_sfx_combo
    - flash_combos
    - score_4000
  check_add_combos{current_player.combos_value==3}:
    - combos3_lit
    - add_combos
    - replay_sfx_combo
    - flash_combos
    - score_10000
  check_add_combos{current_player.combos_value==4}:
    - combos4_lit
    - add_combos
    - replay_sfx_combo
    - flash_combos
    - score_20000
  check_add_combos{current_player.combos_value==5}:
    - combos5_lit
    - add_combos
    - replay_sfx_combo
    - flash_combos
    - score_50000
  check_add_combos{current_player.combos_value==6}:
    - combos6_lit
    - add_combos
    - replay_sfx_combo
    - flash_combos
    - score_150000
  check_add_combos{current_player.combos_value==7}:
    - combos7_lit
    - add_combos
    - replay_sfx_combo
    - flash_combos
    - score_500000
  check_add_combos{current_player.combos_value==8}:
    - combos8_lit
    - check_combo_command_wizard
    - replay_sfx_combo
    - flash_combos
    - score_1000000
  check_combo_command_wizard{current_player.shot_combo_command_wizard == 0}:
    - activate_combo_command_wizard
  check_subtract_combos{current_player.combos_value==8}:
    - combos8_unlit
    - subtract_combos
    - restart_decay_timer
  check_subtract_combos{current_player.combos_value==7}:
    - combos7_unlit
    - subtract_combos
    - restart_decay_timer
  check_subtract_combos{current_player.combos_value==6}:
    - combos6_unlit
    - subtract_combos
    - restart_decay_timer
  check_subtract_combos{current_player.combos_value==5}:
    - combos5_unlit
    - subtract_combos
    - restart_decay_timer
  check_subtract_combos{current_player.combos_value==4}:
    - combos4_unlit
    - subtract_combos
    - restart_decay_timer
  check_subtract_combos{current_player.combos_value==3}:
    - combos3_unlit
    - subtract_combos
    - restart_decay_timer
  check_subtract_combos{current_player.combos_value==2}:
    - combos2_unlit
    - subtract_combos
    - restart_decay_timer
  check_subtract_combos{current_player.combos_value==1}:
    - combos1_unlit
    - reset_combos
  mystery_relaxed_combos:
    - flash_combos
  replay_sfx_combo:
    - stop_sfx_combo
  stop_sfx_combo:
    - play_sfx_combo


