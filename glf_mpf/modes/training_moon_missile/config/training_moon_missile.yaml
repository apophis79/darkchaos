#config_version=6

mode:
  start_events: start_training_moon_missile
  stop_events: mode_base_stopping, stop_training
  priority: 700

combo_switches: 
  cancel_training_mm:
    switches_1: s_LeftFlipperButton
    switches_2: s_RightFlipperButton
    events_when_both: 
      - stop_training
      - play_voc_training_canceled
      - training_stopped
    hold_time: 3000ms
  cancel_training_warning_mm:
    switches_1: s_LeftFlipperButton
    switches_2: s_RightFlipperButton
    events_when_both: 
      - training_cancel_warning
    events_when_inactive: 
      - training_cancel_warning_stop
    hold_time: 1500ms

event_player: 
  mode_training_moon_missile_started:
    - init_training
    - play_lsling_training
    - play_rsling_training
  training_moon_lane_group_collected_complete:
    - training_moon_missile_completed
    - play_sfx_super_jackpot
  timer_training_moon_missile_complete:
    - stop_training
    - training_stopped
    - play_voc_training_incomplete
  training_moon_missile_completed:
    - stop_training
    - training_stopped
  training_moon_lane_group_hit:
    - update_training_select_moon_lane
    - flash_gi
    - play_sfx_LS
    - score_200000
  play_sfx_LS:
    - play_sfx_LS_during_training
  update_training_select_moon_lane{current_player.shot_training_moon_lane1==0}:
    - update_training_select_moon_lane1a
  update_training_select_moon_lane{current_player.shot_training_moon_lane1==1}:
    - update_training_select_moon_lane1b
  update_training_select_moon_lane{current_player.shot_training_moon_lane2==0}:
    - update_training_select_moon_lane2a
  update_training_select_moon_lane{current_player.shot_training_moon_lane2==1}:
    - update_training_select_moon_lane2b
  update_training_select_moon_lane{current_player.shot_training_moon_lane3==0}:
    - update_training_select_moon_lane3a
  update_training_select_moon_lane{current_player.shot_training_moon_lane3==1}:
    - update_training_select_moon_lane3b
  update_training_select_moon_lane{current_player.shot_training_moon_lane4==0}:
    - update_training_select_moon_lane4a
  update_training_select_moon_lane{current_player.shot_training_moon_lane4==1}:
    - update_training_select_moon_lane4b
  timer_training_moon_missile_tick:
    - flicker_gi
  balldevice_moon_lock_ball_enter{device.ball_devices.moon_lock.balls > current_player.moon_launch_locked_balls}:
    - delayed_release_moon_ball


random_event_player: 
  flicker_gi: 
    events:
      play_flicker_gi01: 1
      play_flicker_gi02: 1
      play_flicker_gi03: 1
      play_flicker_gi04: 1
      play_flicker_gi05: 1
      play_flicker_gi06: 1
      play_flicker_gi07: 1
      play_flicker_gi08: 1
      play_flicker_gi09: 1
      play_flicker_gi10: 1
      play_flicker_gi11: 1
      play_flicker_gi12: 1
      play_flicker_gi13: 1
      play_flicker_gi14: 1
      play_flicker_gi15: 1
      play_flicker_gi16: 1
      play_flicker_gi17: 1
      play_flicker_gi18: 1
      play_flicker_gi19: 1
      play_flicker_gi20: 1
      play_flicker_gi21: 1
      play_flicker_gi22: 1
    scope: player


segment_display_player: 
  init_training: 
    player1: 
      text: " "
      expire: 5000ms
      flashing: off
    player2: 
      text: "TRAIN "
      expire: 5000ms
      flashing: off
    player3: 
      text: "MOON "
      expire: 5000ms
      flashing: off
    player4: 
      text: " "
      expire: 5000ms
      flashing: off
    pf: 
      text: "{device.timers.training_moon_missile.ticks:0>2}"
      flashing: off


shot_groups: 
  training_moon_lane_group:
    shots: training_moon_lane1,training_moon_lane2,training_moon_lane3,training_moon_lane4
    rotate_left_events: s_LeftFlipperButton_active
    rotate_right_events: s_RightFlipperButton_active

shots: 
  training_moon_lane1:
    switch: s_LeftOutlane
    profile: train_moon_missile
    show_tokens: 
      lights: LLO
      color: ccbb00
  training_moon_lane2:
    switch: s_LeftInlane
    profile: train_moon_missile
    show_tokens: 
      lights: LLI
      color: ccbb00
  training_moon_lane3:
    switch: s_RightInlane
    profile: train_moon_missile
    show_tokens: 
      lights: LRI
      color: ccbb00
  training_moon_lane4:
    switch: s_RightOutlane
    profile: train_moon_missile
    show_tokens: 
      lights: LRO
      color: ccbb00

