timers: 
  training_moon_missile:
    start_value: 69
    end_value: 0
    direction: down
    control_events: 
      - event: init_training
        action: restart
    restart_on_complete: False
    start_running: False
    tick_interval: 1000ms

variable_player: 
  update_training_select_moon_lane1a: 
    shot_training_select_moon_lane1: 
      action: set
      int: 0

  update_training_select_moon_lane1b: 
    shot_training_select_moon_lane1: 
      action: set
      int: 3

  update_training_select_moon_lane2a: 
