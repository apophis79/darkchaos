  s_start_active{current_player.hs_input_ready == 1}:
    - text_inputted
  text_inputted.1{machine.high_score_initials_chars == 3}:
    - text_input_high_score_complete:{text: machine.high_score_initials}
  timer_high_score_timeout_complete:
