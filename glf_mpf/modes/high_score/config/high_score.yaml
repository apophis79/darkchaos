show_player: 
  mode_high_score_started: 
    rainbow: 
      key: key_hs_show
      show_tokens: 
        lights: "GI"


sound_player: 
  mode_high_score_started: 
    mus_victory: 
      key: key_mus_highscore
      action: play
  text_inputted.4: 
    sfx_hs_initial: 
      key: key_sfx_hs_initial
      action: play


timers: 
  hs_cooldown:
    start_value: 0
    end_value: 1
    direction: up
    control_events: 
      - event: text_inputted{machine.high_score_initials_chars < 3}
        action: restart
    restart_on_complete: False
    start_running: False
    tick_interval: 200ms
  high_score_timeout:
    start_value: 60
    end_value: 0
    direction: down
    control_events: 
      - event: high_score_enter_initials
        action: restart
      - event: text_input_high_score_complete.1
        action: stop
    restart_on_complete: False
    start_running: False
    tick_interval: 1000ms
  high_score_award_timeout:
    start_value: 5
    end_value: 0
    direction: down
    control_events: 
      - event: high_score_award_display.1
        action: restart
    restart_on_complete: False
    start_running: False
    tick_interval: 1000ms

variable_player: 
  s_LeftFlipperButton_active.2{current_player.hs_input_ready == 1}: 
    high_score_initials_index: 
      action: add_machine
      int: -1

  s_RightFlipperButton_active.2{current_player.hs_input_ready == 1}: 
    high_score_initials_index: 
      action: add_machine
      int: 1

  text_inputted.3{(((machine.high_score_initials_index Mod 37) + 37) Mod 37) == 0}: 
    high_score_initials: 
      action: set_machine
      string: machine.high_score_initials & "A"

  text_inputted.3{(((machine.high_score_initials_index Mod 37) + 37) Mod 37) == 1}: 
    high_score_initials: 
      action: set_machine
