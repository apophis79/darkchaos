shot_groups: 
  qualify_mystery:
    shots: mystery_shot1,mystery_shot2,mystery_shot3,mystery_shot4,mystery_shot5
    restart_events: restart_qualify_mystery
    enable_events: stop_meteor_wave
    disable_events: select_random_mystery, start_meteor_wave

shots: 
  mystery_shot1:
    switch: s_TargetMystery1
    profile: flicker_on
    show_tokens: 
      lights: "LM1"
      color: "f7b5c9"
    control_events: 
      - events: complete_mystery_shots
        state: 1
  mystery_shot2:
    switch: s_TargetMystery2
    profile: flicker_on
    show_tokens: 
      lights: "LM2"
      color: "f7b5c9"
    control_events: 
      - events: complete_mystery_shots
        state: 1
  mystery_shot3:
    switch: s_TargetMystery3
    profile: flicker_on
    show_tokens: 
      lights: "LM3"
      color: "f7b5c9"
    control_events: 
      - events: complete_mystery_shots
        state: 1
  mystery_shot4:
    switch: s_TargetMystery4
    profile: flicker_on
    show_tokens: 
      lights: "LM4"
      color: "f7b5c9"
    control_events: 
      - events: complete_mystery_shots
        state: 1
  mystery_shot5:
    switch: s_TargetMystery5
    profile: flicker_on
    show_tokens: 
      lights: "LM5"
      color: "f7b5c9"
    control_events: 
      - events: complete_mystery_shots
        state: 1
  mystery_ready:
    profile: qualified_shot
    restart_events: restart_qualify_mystery
    show_tokens: 
      lights: "LMR"
      color: "f7b5c9"
    control_events: 
      - events: qualify_mystery_on_complete
        state: 1

show_player: 
  qualify_mystery_on_complete: 
    flash_color: 
      key: key_mystery_qualified
      loops: 6
      speed: 13
      show_tokens: 
        lights: "tMystery"
        color: "f7b5c9"
  mystery_flash: 
    flash_color: 
      key: key_loaded_wiz_ready
      loops: 3
      speed: 20
      show_tokens: 
        lights: "tFlasherU"
        color: "f7b5c9"
  play_mystery_show: 
    gi_spin1_cw: 
      key: key_mystery_show
      loops: 1
      show_tokens: 
        intensity: "100"
      events_when_completed: restart_qualify_mystery


