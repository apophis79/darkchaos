#config_version=6

mode:
  start_events: new_ball_started, stop_meteor_wave, stop_training, wizard_mode_ended
  stop_events: stop_mystery, mode_base_stopping, start_training_select, wizard_mode_started
  priority: 580

event_player: 
  mode_mystery_started{current_player.shot_mystery_ready==1 and machine.flippers_are_dead==0}:
    - enable_scoop_hold
  check_mystery{current_player.shot_mystery_ready==0 and machine.flippers_are_dead==0}:
    - check_training
  check_mystery{current_player.shot_mystery_ready==1 and machine.flippers_are_dead==0}:
    - select_random_mystery
  select_random_mystery:
    - play_mystery_show
  restart_qualify_mystery{current_player.shot_training_ready==0}:
    - release_scoop_hold
  release_scoop_hold:
    - disable_scoop_hold
    - start_mwq_timer
  restart_qualify_mystery:
    - mystery_select_done
    - check_training
  sss_mystery_ready:
    - complete_mystery_shots
    - set_sss_mystery_flag
  qualify_mystery_on_complete{current_player.flag_sss_mystery == 0}:
    - play_voc_LMR
    - enable_scoop_hold
    - mystery_flash
    - score_30000
  qualify_mystery_hit:
    - score_1000


random_event_player: 
  select_random_mystery: 
    events:
      mystery_full_health{current_player.shot_health9_light == 0}: 1
      mystery_full_protons{current_player.shot_proton_round6 == 0}: 0.7
      mystery_added_cluster{current_player.shot_cluster_bomb2 == 0}: 0.8
      mystery_added_saver{current_player.shot_ship_charge3 != 2}: 1
      mystery_added_shields{current_player.shot_shield_left == 0}: 1
      mystery_moon_ready{current_player.shot_moon_missile2 == 0 and device.state_machines.moon_mb.state!="locking"}: 1
      mystery_double_scoring{current_player.scoring_multiplier == 1}: 0.5
      mystery_super_spinner{current_player.spin_multiplier == 1}: 0.5
      mystery_super_pops{current_player.pop_multiplier == 1}: 0.5
      mystery_double_bonus{current_player.bonus_multiplier == 1}: 0.5
      mystery_relaxed_combos{current_player.combos_relaxed == 0}: 0.5
      activate_nuke{current_player.nuke_acquired == 0}: 0.5
    scope: player
  qualify_mystery_hit: 
    events:
      play_sfx_LM1: 1
      play_sfx_LM2: 1
      play_sfx_LM3: 1
      play_sfx_LM4: 1
      play_sfx_LM5: 1
    scope: player


