slide_player: 
  mode_training_cluster_bomb_started: 
    training_clusters:
      action: play
      expire: 0s


timers: 
  training_cluster_bomb:
    start_value: 69
    end_value: 0
    direction: down
    control_events: 
      - event: init_training
        action: restart
    restart_on_complete: False
    start_running: False
    tick_interval: 1000ms

variable_player: 
  training_achieved: 
    training_cluster_bomb_achieved: 
      action: set
      int: 1
    training_total_achieved: 
      action: add
      int: 1
    training_just_finished: 
      action: set
      int: 1

  start_moon_multiball: 
    training_moon_missile_used: 
      action: set
      int: 1




