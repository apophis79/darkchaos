#config_version=6

mode:
  start_events: start_double_scoring, mystery_double_scoring
  stop_events: mode_base_stopping, stop_double_scoring, init_training
  priority: 700

event_player: 
  timer_double_scoring_complete:
    - stop_double_scoring


segment_display_player: 
  mode_double_scoring_started: 
    player1: 
      text: ""
      expire: 5000ms
      flashing: off
    player2: 
      text: " DOUBLE "
      expire: 5000ms
      flashing: all
    player3: 
      text: "SCORING"
      expire: 5000ms
      flashing: all
    player4: 
      text: ""
      expire: 5000ms
      flashing: off


shots: 
  double_scoring:
    profile: double_scoring
    show_tokens: 
    reset_events: mode_double_scoring_stopping
    control_events: 
      - events: mode_double_scoring_started
        state: 1
      - events: timer_double_scoring_tick{device.timers.double_scoring.ticks == 55}
        state: 2

sound_player: 
  mode_double_scoring_started: 
    sfx_LDS: 
      key: key_sfx_LDS
      action: play


timers: 
  double_scoring:
    start_value: 0
    end_value: 60
    direction: up
    control_events: 
      - event: mode_double_scoring_started
        action: restart
    restart_on_complete: False
    start_running: False
    tick_interval: 1000ms

variable_player: 
  mode_double_scoring_started: 
    scoring_multiplier: 
      action: set
      int: 2

  mode_double_scoring_stopping: 
    scoring_multiplier: 
      action: set
      int: 1




