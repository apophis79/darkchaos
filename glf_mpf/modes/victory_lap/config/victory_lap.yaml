slide_player: 
  mode_victory_lap_started: 
    plunge_for_victory:
      action: play
      expire: 0s
  run_victory_lap: 
    plunge_for_victory:
      action: remove
      expire: 0s
  play_mus_victory: 
    victory:
      action: play
      expire: 0s


sound_player: 
  play_mus_victory: 
    mus_victory: 
      key: key_mus_victory
      action: play
      events_when_stopped: 
        - mus_victory_stopped


timers: 
  victory_countdown:
    start_value: 66
    end_value: 0
    direction: down
    control_events: 
      - event: run_victory_lap
        action: restart
    restart_on_complete: False
    start_running: False
    tick_interval: 1000ms
  victory_bumper_lights:
    start_value: 0
    end_value: 500
    direction: up
    control_events: 
      - event: run_victory_lap
        action: restart
    restart_on_complete: False
    start_running: False
    tick_interval: 250ms

variable_player: 
  mode_victory_lap_started: 
    victory: 
      action: set
      int: 1
    victory_lap_running: 
      action: set
      int: 0

  run_victory_lap: 
    victory_lap_running: 
      action: set
      int: 1

  set_won_game: 
    won_game: 
      action: set_machine
      int: 1




