#config_version=6

mode:
  start_events: asteroid_destroyed, restart_victory
  stop_events: mode_base_stopping, end_victory_lap
  priority: 9999

ball_saves: 
  victory_startup:
    active_time: 13000ms
    enable_events: victory_startup_ballsave
    auto_launch: false
    balls_to_save: 1

event_player: 
  mode_victory_lap_started:
    - stop_asteroid_motor
    - set_won_game
    - meteor_wave_music_stop
    - turn_off_gi
    - victory_startup_ballsave
  ball_launch_hit{current_player.victory_lap_running == 0}:
    - run_victory_lap
    - enable_flippers
  s_Plunger1_active{current_player.victory_lap_running == 0}:
    - init_victory_lap
    - stop_final_wave_wizard
    - enable_flippers
    - deactivate_nuke
  timer_victory_countdown_tick{device.timers.victory_countdown.ticks == 21}:
    - timer_victory_countdown_kill
  timer_victory_countdown_kill:
    - kill_flippers
  run_victory_lap:
    - victory_bumpers_show
    - play_mus_victory
    - run_victory_lap_show
    - play_vic_lsling_show
    - play_vic_rsling_show
  timer_victory_bumper_lights_tick:
    - victory_bumpers_show
    - victory_gi_show1
    - victory_gi_show2
    - victory_gi_show3
  s_TargetMystery1_active:
    - victory_fireworks_show
    - victory_flashers_show
    - score_200000
  s_TargetMystery2_active:
    - victory_fireworks_show
    - victory_flashers_show
    - score_200000
