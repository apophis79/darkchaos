  ball_search_started:
    - release_moon_ball
  timer_victory_countdown_complete:
    - end_victory_lap


multiballs: 
  victory:
    start_events: run_victory_lap
    ball_count: 5
    ball_count_type: total
    shoot_again: 45000
    hurry_up_time: 3000
    grace_period: 0
    ball_locks: 

