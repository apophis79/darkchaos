segment_display_player: 
  init_victory_lap: 
    player1: 
      text: " YOU "
      flashing: all
    player2: 
      text: " SAVED "
      flashing: all
    player3: 
      text: "US  "
      flashing: all
    player4: 
      text: "ALL "
      flashing: all

  run_victory_lap: 
    player1: 
      action: remove
      flashing: off
    player2: 
      action: remove
      flashing: off
    player3: 
      action: remove
      flashing: off
    player4: 
      action: remove
      flashing: off
    pf: 
      text: "{device.timers.victory_countdown.ticks-21:0>2}"
      flashing: off

  timer_victory_countdown_kill: 
    pf: 
      text: "00"
      priority: 100
      flashing: off


