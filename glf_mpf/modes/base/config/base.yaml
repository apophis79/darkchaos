timers: 
  delay_ball_release:
    start_value: 0
    end_value: 1
    direction: up
    control_events: 
      - event: delayed_release_moon_ball
        action: restart
    restart_on_complete: False
    start_running: False
    tick_interval: 1000ms
  delay_raise_lock_pin:
    start_value: 0
    end_value: 1
    direction: up
    control_events: 
      - event: release_moon_ball
        action: restart
    restart_on_complete: False
    start_running: False
    tick_interval: 240ms
  plunger_check:
    start_value: 0
    end_value: 5
    direction: up
    control_events: 
      - event: restart_plunger_check
        action: restart
      - event: s_Plunger1_inactive
        action: stop
    restart_on_complete: False
    start_running: False
    tick_interval: 1000ms
  center_orbit:
    start_value: 0
    end_value: 1
    direction: up
    control_events: 
      - event: center_orbit_hit
        action: restart
    restart_on_complete: False
    start_running: False
    tick_interval: 1500ms

