#config_version=6

mode:
  start_events: ball_started
  stop_events: ball_ended, mode_eob_bonus_started, tilt
  priority: 200

ball_holds: 
  scoop_hold:
    enable_events: enable_scoop_hold
    disable_events: disable_scoop_hold
    hold_devices: scoop
    balls_to_hold: 1
    release_all_events: tilt, release_scoop_hold

ball_saves: 
  new_ball:
    active_time: 6000ms
    grace_period: 2000ms
    hurry_up_time: 3000ms
    enable_events: new_ball_active
    auto_launch: true
    balls_to_save: -1
  wave_coming:
    active_time: 1500ms
    grace_period: 500ms
    hurry_up_time: 0ms
    enable_events: timer_meteor_countdown_tick{device.timers.meteor_countdown.ticks == 1}
    auto_launch: true
    balls_to_save: 1

combo_switches: 
  flipper_cancel:
    switches_1: s_LeftFlipperButton
    switches_2: s_start
    events_when_both: 
      - glf_game_cancel
    hold_time: 5000ms

event_player: 
  mode_base_started:
    - stop_attract_mode
    - knockdown_meteors
    - check_base_restart
    - start_asteroid_motor
    - backglass_dark_on
    - backglass_chaos_on
    - backglass_wave_off
    - check_plunger
    - display_player_scores
  display_player_scores{machine.last_game_players>0}:
    - display_p1_score
  display_player_scores{machine.last_game_players>1}:
    - display_p2_score
  display_player_scores{machine.last_game_players>2}:
    - display_p3_score
  display_player_scores{machine.last_game_players>3}:
    - display_p4_score
  mode_base_started{current_player.wizard_final_hit_count > 0}:
    - new_ball_started
  mode_base_started{current_player.number == 1}:
    - flash_player1_score
    - display34_ball_num
  mode_base_started{current_player.number == 2}:
    - flash_player2_score
    - display34_ball_num
  mode_base_started{current_player.number == 3}:
    - flash_player3_score
    - display12_ball_num
  mode_base_started{current_player.number == 4}:
    - flash_player4_score
    - display12_ball_num
  s_Plunger2_active{current_player.wizard_final_hit_count > 0 and current_player.ball_just_started==1}:
    - new_ball_active
    - remove_display34_ball_num
    - remove_display12_ball_num
    - stop_flash_player1_score
    - stop_flash_player2_score
    - stop_flash_player3_score
    - stop_flash_player4_score
  mode_base_stopping:
    - training_music_stop
  mode_meteor_wave_stopped:
    - backglass_dark_on
    - backglass_chaos_on
    - backglass_wave_off
  stop_training:
    - check_base_restart
    - training_music_stop
  check_base_restart{current_player.nuke_acquired == 1 and current_player.nuke_used == 0}:
    - activate_nuke
  check_base_restart{current_player.shot_meteor_wave1 == 0}:
    - meteor_wave0_restart
  check_base_restart{current_player.shot_meteor_wave1 == 1}:
    - meteor_wave1_restart
  check_base_restart{current_player.shot_meteor_wave2 == 1}:
    - meteor_wave2_restart
  check_base_restart{current_player.shot_meteor_wave3 == 1}:
    - meteor_wave3_restart
  check_base_restart{current_player.shot_meteor_wave4 == 1}:
    - meteor_wave4_restart
  check_base_restart{current_player.shot_meteor_wave5 == 1}:
    - meteor_wave5_restart
  check_base_restart{current_player.shot_meteor_wave6 == 1}:
    - meteor_wave6_restart
  check_base_restart{current_player.shot_meteor_wave7 == 1}:
    - meteor_wave7_restart
  check_base_restart{current_player.shot_meteor_wave8 == 1}:
    - meteor_wave8_restart
  check_base_restart{current_player.shot_meteor_wave9 == 1}:
    - meteor_wave9_restart
  check_base_restart{current_player.shot_meteor_wave1 == 2 and current_player.shot_meteor_wave2 == 0}:
    - meteor_wave2_restart
  check_base_restart{current_player.shot_meteor_wave2 == 2 and current_player.shot_meteor_wave3 == 0}:
    - meteor_wave3_restart
  check_base_restart{current_player.shot_meteor_wave3 == 2 and current_player.shot_meteor_wave4 == 0}:
    - meteor_wave4_restart
  check_base_restart{current_player.shot_meteor_wave4 == 2 and current_player.shot_meteor_wave5 == 0}:
    - meteor_wave5_restart
  check_base_restart{current_player.shot_meteor_wave5 == 2 and current_player.shot_meteor_wave6 == 0}:
    - meteor_wave6_restart
  check_base_restart{current_player.shot_meteor_wave6 == 2 and current_player.shot_meteor_wave7 == 0}:
    - meteor_wave7_restart
  check_base_restart{current_player.shot_meteor_wave7 == 2 and current_player.shot_meteor_wave8 == 0}:
    - meteor_wave8_restart
  check_base_restart{current_player.shot_meteor_wave8 == 2 and current_player.shot_meteor_wave9 == 0}:
    - meteor_wave9_restart
  mode_base_started{current_player.shot_final_wave_wizard == 2 and current_player.victory == 0}:
    - run_final_wave_wizard
    - wizard_mode_started
  mode_base_started{current_player.shot_final_wave_wizard == 1 and current_player.victory == 0}:
    - activate_final_wave_wizard
  mode_base_started{current_player.shot_combo_command_wizard == 1 and current_player.victory == 0}:
    - activate_combo_command_wizard
  mode_base_started{current_player.shot_fully_loaded_wizard == 1 and current_player.victory == 0}:
    - activate_fully_loaded_wizard
  mode_base_started{current_player.victory == 1}:
    - restart_victory
  check_fully_loaded{current_player.shot_fully_loaded_wizard == 0 and current_player.shot_cluster_bomb2 == 1 and current_player.shot_proton_round6 == 1 and  current_player.shot_moon_missile2 == 1}:
    - prime_fully_loaded_wizard
  prime_fully_loaded_wizard{current_player.meteor_wave_running == 0}:
    - activate_fully_loaded_wizard
  start_meteor_wave:
    - disable_scoop_hold
    - stop_ccwiz_scoop_show
    - stop_flwiz_scoop_show
  stop_meteor_wave{current_player.shot_final_wave_wizard == 1}:
    - activate_final_wave_wizard
  stop_meteor_wave{current_player.shot_combo_command_wizard == 1}:
    - activate_combo_command_wizard
  stop_meteor_wave{current_player.shot_fully_loaded_wizard == 1}:
    - activate_fully_loaded_wizard
  activate_final_wave_wizard:
    - wizard_mode_ready
    - run_fwwiz_scoop_show
    - run_asteroid_spotlight_show
    - wizard_mode_started
  activate_combo_command_wizard:
    - wizard_mode_ready
    - run_ccwiz_scoop_show
  activate_fully_loaded_wizard:
    - wizard_mode_ready
    - run_flwiz_scoop_show
  wizard_mode_ready:
    - enable_scoop_hold
  run_fwwiz_scoop_show:
    - stop_flwiz_scoop_show
    - stop_ccwiz_scoop_show
  run_ccwiz_scoop_show:
    - stop_flwiz_scoop_show
  run_ccwiz_scoop_show{current_player.shot_final_wave_wizard == 1}:
    - stop_ccwiz_scoop_show
  run_flwiz_scoop_show{current_player.shot_combo_command_wizard == 1 or current_player.shot_final_wave_wizard == 1}:
    - stop_flwiz_scoop_show
  balldevice_scoop_ball_entered{current_player.wizard_mode_is_ready == 1 and current_player.shot_final_wave_wizard == 1 and current_player.meteor_wave_running == 0}:
    - run_final_wave_wizard
    - wizard_mode_started
    - stop_fwwiz_scoop_show
    - stop_asteroid_spotlight_show
    - clear_wizard_mode_ready
  balldevice_scoop_ball_entered{current_player.wizard_mode_is_ready == 1 and current_player.shot_combo_command_wizard == 1 and current_player.shot_final_wave_wizard != 1 and current_player.meteor_wave_running == 0}:
    - run_combo_command_wizard
    - wizard_mode_started
    - stop_ccwiz_scoop_show
    - clear_wizard_mode_ready
  balldevice_scoop_ball_entered{current_player.wizard_mode_is_ready == 1 and current_player.shot_fully_loaded_wizard == 1  and current_player.shot_combo_command_wizard != 1 and current_player.shot_final_wave_wizard != 1 and current_player.meteor_wave_running == 0}:
    - run_fully_loaded_wizard
    - wizard_mode_started
    - stop_flwiz_scoop_show
    - clear_wizard_mode_ready
  completed_final_wave_wizard:
    - wizard_mode_ended
  completed_combo_command_wizard:
    - wizard_mode_ended
    - check_base_restart
  completed_fully_loaded_wizard:
    - wizard_mode_ended
    - check_base_restart
  s_CenterOrb1_active{current_player.center_orbit_just_hit == 0}:
    - center_orbit_hit
  s_CenterOrb2_active{current_player.center_orbit_just_hit == 0}:
    - center_orbit_hit
  s_CenterOrb3_active{current_player.center_orbit_just_hit == 0}:
    - center_orbit_hit
  center_orbit_hit:
    - play_sfx_Orb
    - score_2000
  left_side_hit:
    - play_sfx_Orb
    - score_2000
  s_Bumper1_active:
    - play_sfx_bumper
    - score_1300
  s_Bumper2_active:
    - play_sfx_bumper
    - score_1300
  s_Bumper3_active:
    - play_sfx_bumper
    - score_1300
  s_TopSlingshot_active:
    - play_sfx_bumper
    - score_1300
  s_Spinner_active:
    - score_930
  meteor_wave_music_stop:
    - meteor_wave0_music_stop
    - meteor_wave1_music_stop
    - meteor_wave2_music_stop
    - meteor_wave3_music_stop
    - meteor_wave4_music_stop
    - meteor_wave5_music_stop
    - meteor_wave6_music_stop
    - meteor_wave7_music_stop
    - meteor_wave8_music_stop
    - meteor_wave9_music_stop
  s_TargetMystery5_active:
    - magnet_activated_flash
    - magnet_activated_gi
  s_TimewarpRamp_active:
    - left_ramp_hit
  balldevice_moon_lock_ball_entered:
    - right_ramp_hit
  s_LeftBumper1_active:
    - left_side_hit
  knockdown_meteors:
    - meteor1_knockdown
    - meteor2_knockdown
    - meteor3_knockdown
    - meteor4_knockdown
  balldevice_moon_lock_ball_enter{current_player.shot_final_wave_wizard == 1}:
    - delayed_release_moon_ball
  timer_delay_ball_release_complete:
    - release_moon_ball
  timer_delay_raise_lock_pin_complete:
    - raise_lock_pin
  s_LockOut_active:
    - raise_lock_pin
  s_LeftSlingshot_active:
    - play_lsling_base_show
    - score_1000
  s_RightSlingshot_active:
    - play_rsling_base_show
    - score_1000
  slings_powerup_added:
    - pu_lsling1_show
    - pu_lsling2_show
    - pu_rsling1_show
    - pu_rsling2_show
  balldevice_scoop_ball_eject_attempt:
    - scoop_blast
  check_plunger{current_player.ball_just_started==0}:
    - restart_plunger_check
  timer_plunger_check_complete:
    - plunger_eject


light_player: 
  mode_base_started: 
    GI: 
      color: ffdca3
      fade: 200

  activate_final_wave_wizard: 
    GI: 
      color: 000000

  turn_off_gi: 
    GI: 
      color: 000000


random_event_player: 
  play_sfx_Orb: 
