      priority: 100
      flashing: all

  stop_flash_player2_score: 
    player2: 
      key: p2_score_flash
      action: remove
      flashing: off

  flash_player3_score: 
    player3: 
      key: p3_score_flash
      text: "{players[2].score:0>2}"
      priority: 100
      flashing: all

  stop_flash_player3_score: 
    player3: 
      key: p3_score_flash
      action: remove
      flashing: off

  flash_player4_score: 
    player4: 
      key: p4_score_flash
      text: "{players[3].score:0>2}"
      priority: 100
      flashing: all

  stop_flash_player4_score: 
    player4: 
      key: p4_score_flash
