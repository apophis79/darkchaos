      priority: 10000
      flashing: off

  remove_display12_ball_num: 
    player1: 
      key: p1_ball_num
      action: remove
      flashing: off
    player2: 
      key: p2_ball_num
      action: remove
      flashing: off


sequence_shots: 
  left_orbit:
    switch_sequence: 
      - s_LeftOrb1
      - s_LeftOrb2
    sequence_timeout: 500ms
  inner_orbit:
    switch_sequence: 
      - s_InnerOrb1
      - s_InnerOrb2
    sequence_timeout: 300ms
  right_orbit:
    switch_sequence: 
      - s_RightOrb1
      - s_RightOrb2
    sequence_timeout: 500ms
  ball_launch:
    event_sequence: 
      - s_Plunger1_inactive
      - s_Plunger2_inactive
    sequence_timeout: 300ms

