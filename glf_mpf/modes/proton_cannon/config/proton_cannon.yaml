      speed: 15
      show_tokens: 
        lights: "tProtonAll"
        color: "00dddd"
  proton_added_show: 
    flash_color: 
      key: key_all_proton_charged
      priority: 100
      loops: 12
      speed: 15
      show_tokens: 
        lights: "tInlaneGI"
        color: "00dddd"
  s_Spinner_active: 
    flash_color_with_fade: 
      key: key_spinner_flash
      loops: 0
      speed: 15
      show_tokens: 
        lights: "FL4"
        color: "00dddd"
        fade: "300"
  lsling_powerup_pc: 
    lsling_rotate2_cw: 
      key: key_lsling_powerup_pc
      loops: 2
      speed: 2
      show_tokens: 
        color1: "00dddd"
        color2: "00dddd"
        intensity: "100"
  rsling_powerup_pc: 
    rsling_rotate2_ccw: 
      key: key_rsling_powerup_pc
      loops: 2
      speed: 2
      show_tokens: 
        color1: "00dddd"
        color2: "00dddd"
        intensity: "100"


