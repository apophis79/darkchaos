#config_version=6

mode:
  start_events: new_ball_started, stop_training, wizard_mode_ended
  stop_events: mode_base_stopping, start_training_select, wizard_mode_started
  priority: 900

event_player: 
  mode_proton_cannon_started{current_player.shot_proton_charge1==0}:
    - reset_proton_charges
  mode_proton_cannon_started{current_player.training_proton_cannon_achieved==1}:
    - reset_proton_charges
  reset_proton_charges{current_player.training_proton_cannon_achieved==0}:
    - ready_proton_charge1
  reset_proton_charges{current_player.training_proton_cannon_achieved==1}:
    - light_proton_charge1
    - light_proton_charge2
    - ready_proton_charge3
  inner_orbit_hit{current_player.shot_proton_charge1 == 1}:
    - play_sfx_LPC
    - light_proton_charge1
    - ready_proton_charge2
  inner_orbit_hit{current_player.shot_proton_charge1 == 2 and current_player.shot_proton_charge2 == 1}:
    - play_sfx_LPC
    - light_proton_charge2
    - ready_proton_charge3
  inner_orbit_hit{current_player.shot_proton_charge2 == 2 and current_player.shot_proton_charge3 == 1}:
    - play_sfx_LPC
    - light_proton_charge3
  light_proton_charge3{current_player.shot_proton_round1 == 0}:
    - added_proton
    - add_proton_round1
    - reset_proton_charges
  light_proton_charge3{current_player.shot_proton_round1 == 1 and current_player.shot_proton_round2 == 0}:
    - added_proton
    - add_proton_round2
    - reset_proton_charges
  light_proton_charge3{current_player.shot_proton_round2 == 1 and current_player.shot_proton_round3 == 0}:
    - added_proton
    - add_proton_round3
    - reset_proton_charges
  light_proton_charge3{current_player.shot_proton_round3 == 1 and current_player.shot_proton_round4 == 0}:
    - added_proton
    - add_proton_round4
    - reset_proton_charges
  light_proton_charge3{current_player.shot_proton_round4 == 1 and current_player.shot_proton_round5 == 0}:
    - added_proton
    - add_proton_round5
    - reset_proton_charges
  light_proton_charge3{current_player.shot_proton_round5 == 1 and current_player.shot_proton_round6 == 0}:
    - added_proton
    - add_proton_round6
    - check_fully_loaded
  added_proton:
    - slings_powerup_added
    - lsling_powerup_pc
    - rsling_powerup_pc
    - proton_added_show
  mystery_full_protons:
    - complete_full_protons
    - slings_powerup_added
    - lsling_powerup_pc
    - rsling_powerup_pc
  complete_full_protons:
    - proton_added_show
    - check_fully_loaded
    - score_50000
  inner_orbit_hit:
    - score_2000
  light_proton_charge3:
    - score_5000


random_event_player: 
  play_sfx_LPC: 
    events:
      play_sfx_LPC1: 1
      play_sfx_LPC2: 1
      play_sfx_LPC3: 1
      play_sfx_LPC4: 1
      play_sfx_LPC5: 1
    scope: player


segment_display_player: 
  light_proton_charge3: 
    player4: 
      text: "PROTON"
      expire: 2000ms
      flashing: all


shots: 
  proton_charge1:
    profile: powerups
    restart_events: reset_proton_charges
    show_tokens: 
      lights: "LPC1"
      color: "00dddd"
    control_events: 
      - events: ready_proton_charge1
        state: 1
      - events: light_proton_charge1, complete_full_protons
        state: 2
  proton_charge2:
    profile: powerups
    restart_events: reset_proton_charges
    show_tokens: 
      lights: "LPC2"
      color: "00dddd"
    control_events: 
      - events: ready_proton_charge2
        state: 1
      - events: light_proton_charge2, complete_full_protons
        state: 2
  proton_charge3:
    profile: powerups
    restart_events: reset_proton_charges
    show_tokens: 
      lights: "LPC3"
      color: "00dddd"
    control_events: 
      - events: ready_proton_charge3
        state: 1
      - events: light_proton_charge3, complete_full_protons
        state: 2
  proton_round1:
    profile: off_on_color
    restart_events: fire_proton_round1
    show_tokens: 
      lights: "LPR1"
      color: "00dddd"
    control_events: 
      - events: add_proton_round1, complete_full_protons
        state: 1
  proton_round2:
    profile: off_on_color
    restart_events: fire_proton_round2
    show_tokens: 
      lights: "LPR2"
      color: "00dddd"
    control_events: 
      - events: add_proton_round2, complete_full_protons
        state: 1
  proton_round3:
    profile: off_on_color
    restart_events: fire_proton_round3
    show_tokens: 
      lights: "LPR3"
      color: "00dddd"
    control_events: 
      - events: add_proton_round3, complete_full_protons
        state: 1
  proton_round4:
    profile: off_on_color
    restart_events: fire_proton_round4
    show_tokens: 
      lights: "LPR4"
      color: "00dddd"
    control_events: 
      - events: add_proton_round4, complete_full_protons
        state: 1
  proton_round5:
    profile: off_on_color
    restart_events: fire_proton_round5
    show_tokens: 
      lights: "LPR5"
      color: "00dddd"
    control_events: 
      - events: add_proton_round5, complete_full_protons
        state: 1
  proton_round6:
    profile: off_on_color
    restart_events: fire_proton_round6
    show_tokens: 
      lights: "LPR6"
      color: "00dddd"
    control_events: 
      - events: add_proton_round6, complete_full_protons
        state: 1

