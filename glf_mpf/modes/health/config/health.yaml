show_player: 
  health_charge1: 
    flash_color: 
      key: key_health_charge1
      loops: 6
      speed: 15
      show_tokens: 
        lights: tHealth
        color: 00dd00
  health_charge2: 
    insert_gi_spin_center: 
      key: key_health_charge2
      priority: 1000
      loops: 0
      speed: 3
      show_tokens: 
        intensity: 100
        color: 00dd00
  complete_full_health: 
    flash_color: 
      key: key_health_full_charged
      loops: 14
      speed: 15
      show_tokens: 
        lights: tHealth
        color: 00dd00
  mode_health_started: 
    flicker_color_on_intensity: 
      key: key_bumpers_on
      speed: 10
      show_tokens: 
        lights: tBumper
        color: ffb46b
        intensity: 10
  lsling_powerup_h: 
    lsling_rotate2_cw: 
      key: key_lsling_powerup_h
      loops: 2
      speed: 2
      show_tokens: 
        color1: 00dd00
        color2: 00dd00
        intensity: 100
  rsling_powerup_h: 
    rsling_rotate2_ccw: 
      key: key_rsling_powerup_h
      loops: 2
      speed: 2
      show_tokens: 
        color1: 00dd00
        color2: 00dd00
        intensity: 100
  s_Bumper1_active: 
    flash_color_with_fade: 
      key: key_bumper1_flash
