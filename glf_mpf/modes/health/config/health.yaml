sound_player: 
  add_health: 
    sfx_LH: 
      key: key_sfx_LH
      action: play


variable_player: 
  restart_health: 
    health_value: 
      action: set
      int: 9

  remove_health: 
    health_value: 
      action: add
      int: -1

  add_health: 
    health_value: 
      action: add
      int: 1

  reset_health_bump: 
    health_bump_value: 
      action: set
      int: 0

  add_health_bump: 
    health_bump_value: 
      action: add
      int: 1




