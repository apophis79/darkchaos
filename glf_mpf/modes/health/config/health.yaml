#config_version=6

mode:
  start_events: new_ball_started, stop_training, wizard_mode_ended
  stop_events: mode_base_stopping, start_training_select, wizard_mode_started
  priority: 800

event_player: 
  mode_health_started{current_player.ball_just_started==1}:
    - restart_health
    - reset_health_bump
  mode_health_started{current_player.training_heal_achieved==1}:
    - raise_diverter
  s_Bumper1_active:
    - check_add_health_bump
  s_Bumper2_active:
    - check_add_health_bump
  s_Bumper3_active:
    - check_add_health_bump
  s_TopSlingshot_active:
    - check_add_health_bump
  check_add_health_bump{current_player.health_bump_value<9}:
    - add_health_bump
  check_add_health_bump{current_player.health_bump_value>=9}:
    - check_add_health
    - reset_health_bump
  check_add_health{current_player.health_value>8}:
    - health9_norm
    - health8_norm
    - health7_norm
    - health6_norm
    - health5_norm
    - health4_norm
    - health3_norm
    - health2_norm
    - health1_norm
    - restart_health
  check_add_health{current_player.health_value==8}:
    - health9_norm
    - add_health
  check_add_health{current_player.health_value==7}:
    - health8_norm
    - add_health
  check_add_health{current_player.health_value==6}:
    - health7_norm
    - health6_norm
    - health5_norm
    - health4_norm
    - health3_norm
    - health2_norm
    - health1_norm
    - add_health
  check_add_health{current_player.health_value==5}:
    - health6_warm
    - add_health
  check_add_health{current_player.health_value==4}:
    - health5_warm
    - add_health
  check_add_health{current_player.health_value==3}:
    - health4_warm
    - health3_warm
    - health2_warm
    - health1_warm
    - add_health
  check_add_health{current_player.health_value==2}:
    - health3_crit
    - add_health
  check_add_health{current_player.health_value==1}:
    - health2_crit
    - add_health
  check_remove_health{current_player.health_value==9}:
    - health9_off
    - remove_health
  check_remove_health{current_player.health_value==8}:
    - health8_off
    - health9_off
    - remove_health
  check_remove_health{current_player.health_value==7}:
    - health7_off
    - health8_off
    - health9_off
    - health6_warm
    - health5_warm
    - health4_warm
    - health3_warm
    - health2_warm
    - health1_warm
    - remove_health
  check_remove_health{current_player.health_value==6}:
    - health6_off
    - health7_off
    - health8_off
    - health9_off
    - remove_health
  check_remove_health{current_player.health_value==5}:
    - health5_off
    - health6_off
    - health7_off
    - health8_off
    - health9_off
    - remove_health
  check_remove_health{current_player.health_value==4}:
    - health4_off
    - health5_off
    - health6_off
    - health7_off
    - health8_off
    - health9_off
    - health3_crit
    - health2_crit
    - health1_crit
    - remove_health
    - play_voc_critically_low_health
  check_remove_health{current_player.health_value==3}:
    - health3_off
    - health4_off
    - health5_off
    - health6_off
    - health7_off
    - health8_off
    - health9_off
    - remove_health
  check_remove_health{current_player.health_value==2}:
    - health2_off
    - health3_off
    - health4_off
    - health5_off
    - health6_off
    - health7_off
    - health8_off
    - health9_off
    - remove_health
    - play_voc_imminent_shutdown
  check_remove_health{current_player.health_value==1}:
    - health1_off
    - health2_off
    - health3_off
    - health4_off
    - health5_off
    - health6_off
    - health7_off
    - health8_off
    - health9_off
    - remove_health
    - kill_flippers
    - turn_off_gi
    - meteor_wave_music_stop
  add_health:
    - slings_powerup_added
    - lsling_powerup_h
    - rsling_powerup_h
    - health_charge1
    - health_charge2
    - score_50000
  earth_hit{current_player.health_value>0}:
    - check_remove_health
  mystery_full_health:
    - complete_full_health
    - restart_health
    - reset_health_bump
    - slings_powerup_added
    - lsling_powerup_h
    - rsling_powerup_h
    - score_100000


