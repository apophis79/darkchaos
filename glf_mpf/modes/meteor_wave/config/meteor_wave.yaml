variable_player: 
  meteor1_raise: 
    num_meteors_to_raise: 
      action: add
      int: -1

  meteor1_down: 
    num_meteors_to_drop: 
      action: add
      int: -1

  meteor2_raise: 
    num_meteors_to_raise: 
      action: add
      int: -1

  meteor2_down: 
    num_meteors_to_drop: 
      action: add
      int: -1

  meteor3_raise: 
    num_meteors_to_raise: 
      action: add
      int: -1

  meteor3_down: 
    num_meteors_to_drop: 
      action: add
      int: -1

  meteor4_raise: 
    num_meteors_to_raise: 
      action: add
      int: -1

  meteor4_down: 
    num_meteors_to_drop: 
      action: add
      int: -1

  mode_meteor_wave_started: 
    meteor_wave_running: 
      action: set
      int: 1
    num_meteors_to_raise: 
      action: set
      int: current_player.meteors_per_wave
    num_meteors_to_drop: 
      action: set
      int: current_player.meteors_per_wave
    nuke_just_used: 
      action: set
      int: 0
    num_wave_current: 
      action: set
      int: current_player.num_waves_completed + 1

  finish_meteor_wave: 
    meteors_per_wave: 
      action: add
      int: 3

  meteor_wave_done: 
    meteor_wave_running: 
      action: set
      int: 0

  score_wave_count: 
    num_waves_completed_this_ball: 
      action: add
      int: 1
    num_waves_completed: 
      action: add
      int: 1

  mode_meteor_wave_stopping: 
    meteor_wave_running: 
      action: set
      int: 0

  light_eb: 
    light_the_eb: 
      action: set
      int: 1

  detonate_nuke.1: 
    num_meteors_to_raise: 
      action: set
      int: 0
    num_meteors_to_drop: 
      action: set
      int: 0
    nuke_just_used: 
      action: set
      int: 1

  zero_num_meteors_to_drop: 
    num_meteors_to_drop: 
      action: set
      int: 0



