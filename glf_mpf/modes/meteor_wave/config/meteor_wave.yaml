state_machines: 
  meteor1:
    starting_state: init
    states: 
      init: 
        label: Init State
      down: 
        label: Down State
        events_when_started: meteor1_down, restart_meteor1_timer
      up_cool: 
        label: Up Cool
        events_when_started: meteor1_cool, meteor1_raise
      up_warm: 
        label: Up Warm
        events_when_started: meteor1_warm
      up_hot: 
        label: Up Hot
        events_when_started: meteor1_hot
    transitions: 
      - source: init
        target: up_cool
        events: 
          - timer_meteor1_init_complete
        events_when_transitioning: restart_meteor1_timer
      - source: down
        target: up_cool
        events: 
          - timer_meteor1_tick{current_player.num_meteors_to_raise>0 and device.timers.meteor1.ticks==2}
      - source: up_cool
        target: up_warm
        events: 
          - timer_meteor1_tick{device.timers.meteor1.ticks==6}
      - source: up_warm
        target: up_hot
        events: 
          - timer_meteor1_tick{device.timers.meteor1.ticks==10}
      - source: up_hot
        target: down
        events: 
          - timer_meteor1_complete
        events_when_transitioning: meteor1_knockdown, earth_hit, earth_flash, earth_bg
      - source: up_cool
        target: down
        events: 
          - s_DTMeteor1_active
        events_when_transitioning: meteor1_hit, meteor1_explodes_show, meteor1_flash_show, meteor1_blink_show, play_sfx_LMet, score_80000
      - source: up_warm
        target: down
        events: 
          - s_DTMeteor1_active
        events_when_transitioning: meteor1_hit, meteor1_explodes_show, meteor1_flash_show, meteor1_blink_show, play_sfx_LMet, score_90000
      - source: up_hot
        target: down
        events: 
          - s_DTMeteor1_active
        events_when_transitioning: meteor1_hit, meteor1_explodes_show, meteor1_flash_show, meteor1_blink_show, play_sfx_LMet, score_100000
      - source: up_cool, up_warm, up_hot
        target: down
        events: 
          - meteor1_proton_hit
          - finish_meteor_wave
          - cluster_bomb_fired
          - detonate_nuke.2
          - mode_meteor_wave_stopping
        events_when_transitioning: meteor1_knockdown
  meteor2:
    starting_state: init
    states: 
      init: 
        label: Init State
      down: 
        label: Down State
        events_when_started: meteor2_down, restart_meteor2_timer
      up_cool: 
        label: Up Cool
        events_when_started: meteor2_cool, meteor2_raise
      up_warm: 
        label: Up Warm
        events_when_started: meteor2_warm
      up_hot: 
        label: Up Hot
        events_when_started: meteor2_hot
    transitions: 
      - source: init
        target: up_cool
        events: 
          - timer_meteor2_init_complete
        events_when_transitioning: restart_meteor2_timer
      - source: down
        target: up_cool
        events: 
          - timer_meteor2_tick{current_player.num_meteors_to_raise>0 and device.timers.meteor2.ticks==2}
      - source: up_cool
        target: up_warm
        events: 
          - timer_meteor2_tick{device.timers.meteor2.ticks==6}
      - source: up_warm
        target: up_hot
        events: 
          - timer_meteor2_tick{device.timers.meteor2.ticks==10}
      - source: up_hot
        target: down
        events: 
          - timer_meteor2_complete
        events_when_transitioning: meteor2_knockdown, earth_hit, earth_flash, earth_bg
      - source: up_cool
        target: down
        events: 
          - s_DTMeteor2_active
        events_when_transitioning: meteor2_hit, meteor2_explodes_show, meteor2_flash_show, meteor2_blink_show, play_sfx_LMet, score_80000
      - source: up_warm
        target: down
        events: 
          - s_DTMeteor2_active
        events_when_transitioning: meteor2_hit, meteor2_explodes_show, meteor2_flash_show, meteor2_blink_show, play_sfx_LMet, score_90000
      - source: up_hot
        target: down
        events: 
          - s_DTMeteor2_active
        events_when_transitioning: meteor2_hit, meteor2_explodes_show, meteor2_flash_show, meteor2_blink_show, play_sfx_LMet, score_100000
      - source: up_cool, up_warm, up_hot
        target: down
        events: 
          - meteor2_proton_hit
          - finish_meteor_wave
          - cluster_bomb_fired
          - detonate_nuke.2
          - mode_meteor_wave_stopping
        events_when_transitioning: meteor2_knockdown
  meteor3:
    starting_state: init
    states: 
      init: 
        label: Init State
      down: 
        label: Down State
        events_when_started: meteor3_down, restart_meteor3_timer
      up_cool: 
        label: Up Cool
        events_when_started: meteor3_cool, meteor3_raise
      up_warm: 
        label: Up Warm
        events_when_started: meteor3_warm
      up_hot: 
        label: Up Hot
        events_when_started: meteor3_hot
    transitions: 
      - source: init
        target: up_cool
        events: 
          - timer_meteor3_init_complete
        events_when_transitioning: restart_meteor3_timer
      - source: down
        target: up_cool
        events: 
          - timer_meteor3_tick{current_player.num_meteors_to_raise>0 and device.timers.meteor3.ticks==2}
      - source: up_cool
        target: up_warm
        events: 
          - timer_meteor3_tick{device.timers.meteor3.ticks==6}
      - source: up_warm
        target: up_hot
        events: 
          - timer_meteor3_tick{device.timers.meteor3.ticks==10}
      - source: up_hot
        target: down
        events: 
          - timer_meteor3_complete
        events_when_transitioning: meteor3_knockdown, earth_hit, earth_flash, earth_bg
      - source: up_cool
        target: down
        events: 
          - s_DTMeteor3_active
        events_when_transitioning: meteor3_hit, meteor3_explodes_show, meteor3_flash_show, meteor3_blink_show, play_sfx_LMet, score_80000
      - source: up_warm
        target: down
        events: 
          - s_DTMeteor3_active
        events_when_transitioning: meteor3_hit, meteor3_explodes_show, meteor3_flash_show, meteor3_blink_show, play_sfx_LMet, score_90000
      - source: up_hot
        target: down
        events: 
          - s_DTMeteor3_active
        events_when_transitioning: meteor3_hit, meteor3_explodes_show, meteor3_flash_show, meteor3_blink_show, play_sfx_LMet, score_100000
      - source: up_cool, up_warm, up_hot
        target: down
        events: 
          - meteor3_proton_hit
          - finish_meteor_wave
          - cluster_bomb_fired
          - detonate_nuke.2
          - mode_meteor_wave_stopping
        events_when_transitioning: meteor3_knockdown
  meteor4:
    starting_state: init
    states: 
      init: 
        label: Init State
      down: 
        label: Down State
        events_when_started: meteor4_down, restart_meteor4_timer
      up_cool: 
        label: Up Cool
        events_when_started: meteor4_cool, meteor4_raise
      up_warm: 
        label: Up Warm
        events_when_started: meteor4_warm
      up_hot: 
        label: Up Hot
        events_when_started: meteor4_hot
    transitions: 
      - source: init
        target: up_cool
        events: 
          - timer_meteor4_init_complete
        events_when_transitioning: restart_meteor4_timer
      - source: down
        target: up_cool
        events: 
          - timer_meteor4_tick{current_player.num_meteors_to_raise>0 and device.timers.meteor4.ticks==2}
      - source: up_cool
        target: up_warm
        events: 
          - timer_meteor4_tick{device.timers.meteor4.ticks==6}
      - source: up_warm
        target: up_hot
        events: 
          - timer_meteor4_tick{device.timers.meteor4.ticks==10}
      - source: up_hot
        target: down
        events: 
          - timer_meteor4_complete
        events_when_transitioning: meteor4_knockdown, earth_hit, earth_flash, earth_bg
      - source: up_cool
        target: down
        events: 
          - s_DTMeteor4_active
        events_when_transitioning: meteor4_hit, meteor4_explodes_show, meteor4_flash_show, meteor4_blink_show, play_sfx_LMet, score_80000
      - source: up_warm
        target: down
        events: 
          - s_DTMeteor4_active
        events_when_transitioning: meteor4_hit, meteor4_explodes_show, meteor4_flash_show, meteor4_blink_show, play_sfx_LMet, score_90000
      - source: up_hot
        target: down
        events: 
          - s_DTMeteor4_active
        events_when_transitioning: meteor4_hit, meteor4_explodes_show, meteor4_flash_show, meteor4_blink_show, play_sfx_LMet, score_100000
      - source: up_cool, up_warm, up_hot
        target: down
        events: 
          - meteor4_proton_hit
          - finish_meteor_wave
          - cluster_bomb_fired
          - detonate_nuke.2
          - mode_meteor_wave_stopping
        events_when_transitioning: meteor4_knockdown

