#config_version=6

mode:
  start_events: start_meteor_wave
  stop_events: stop_meteor_wave, mode_base_stopping, kill_flippers
  priority: 1000

event_player: 
  mode_meteor_wave_started:
    - start_meteor_multiball
    - init_meteor1
    - init_meteor2
    - init_meteor3
    - init_meteor4
    - stop_some_modes_for_mw
    - backglass_dark_off
    - backglass_chaos_off
    - backglass_wave_on
  stop_some_modes_for_mw:
    - stop_skillshots
    - stop_combos
    - stop_ship_save
    - stop_timewarp
    - stop_shields
  mode_meteor_wave_stopping:
    - drop_diverter
  mode_meteor_wave_started{current_player.shot_meteor_wave1 == 0}:
    - meteor_wave1_running
    - meteor_wave0_music_stop
  mode_meteor_wave_started{current_player.shot_meteor_wave1 == 2 and current_player.shot_meteor_wave2 == 0}:
    - meteor_wave2_running
    - meteor_wave1_music_stop
  mode_meteor_wave_started{current_player.shot_meteor_wave2 == 2 and current_player.shot_meteor_wave3 == 0}:
    - meteor_wave3_running
    - meteor_wave2_music_stop
  mode_meteor_wave_started{current_player.shot_meteor_wave3 == 2 and current_player.shot_meteor_wave4 == 0}:
    - meteor_wave4_running
    - meteor_wave3_music_stop
  mode_meteor_wave_started{current_player.shot_meteor_wave4 == 2 and current_player.shot_meteor_wave5 == 0}:
    - meteor_wave5_running
    - meteor_wave4_music_stop
  mode_meteor_wave_started{current_player.shot_meteor_wave5 == 2 and current_player.shot_meteor_wave6 == 0}:
    - meteor_wave6_running
    - meteor_wave5_music_stop
  mode_meteor_wave_started{current_player.shot_meteor_wave6 == 2 and current_player.shot_meteor_wave7 == 0}:
    - meteor_wave7_running
    - meteor_wave6_music_stop
  mode_meteor_wave_started{current_player.shot_meteor_wave7 == 2 and current_player.shot_meteor_wave8 == 0}:
    - meteor_wave8_running
    - meteor_wave7_music_stop
  mode_meteor_wave_started{current_player.shot_meteor_wave8 == 2 and current_player.shot_meteor_wave9 == 0}:
    - meteor_wave9_running
    - meteor_wave8_music_stop
  s_TargetMystery3_active{current_player.shot_proton_round1 == 1 and current_player.shot_proton_round2 == 0}:
    - fire_proton_round1
    - proton_fired
  s_TargetMystery3_active{current_player.shot_proton_round2 == 1 and current_player.shot_proton_round3 == 0}:
    - fire_proton_round2
    - proton_fired
  s_TargetMystery3_active{current_player.shot_proton_round3 == 1 and current_player.shot_proton_round4 == 0}:
    - fire_proton_round3
    - proton_fired
  s_TargetMystery3_active{current_player.shot_proton_round4 == 1 and current_player.shot_proton_round5 == 0}:
    - fire_proton_round4
    - proton_fired
  s_TargetMystery3_active{current_player.shot_proton_round5 == 1 and current_player.shot_proton_round6 == 0}:
    - fire_proton_round5
    - proton_fired
  s_TargetMystery3_active{current_player.shot_proton_round6 == 1}:
    - fire_proton_round6
    - proton_fired
    - reset_proton_charges
  center_orbit_hit{current_player.shot_proton_round1 == 1 and current_player.shot_proton_round2 == 0}:
    - fire_proton_round1
    - proton_fired
  center_orbit_hit{current_player.shot_proton_round2 == 1 and current_player.shot_proton_round3 == 0}:
    - fire_proton_round2
    - proton_fired
  center_orbit_hit{current_player.shot_proton_round3 == 1 and current_player.shot_proton_round4 == 0}:
    - fire_proton_round3
    - proton_fired
  center_orbit_hit{current_player.shot_proton_round4 == 1 and current_player.shot_proton_round5 == 0}:
    - fire_proton_round4
    - proton_fired
  center_orbit_hit{current_player.shot_proton_round5 == 1 and current_player.shot_proton_round6 == 0}:
    - fire_proton_round5
    - proton_fired
  center_orbit_hit{current_player.shot_proton_round6 == 1}:
    - fire_proton_round6
    - proton_fired
    - reset_proton_charges
  proton_fired:
    - check_protons
    - proton_fired_flash_show
    - score_10000
  meteor1_down:
    - check_meteor_wave
  meteor2_down:
    - check_meteor_wave
  meteor3_down:
    - check_meteor_wave
  meteor4_down:
    - check_meteor_wave
  check_meteor_wave.4{current_player.num_meteors_to_drop < 0}:
    - zero_num_meteors_to_drop
  check_meteor_wave.1{current_player.num_meteors_to_drop <= 0 and current_player.nuke_just_used == 0}:
    - meteor_wave_done
  meteor_wave_done{current_player.meteor_wave_running == 1}:
    - finish_meteor_wave
    - score_wave_count
  detonate_nuke{current_player.meteor_wave_running == 1}:
    - finish_meteor_wave
    - score_wave_count
  meteor_wave_done_done.2{current_player.shot_meteor_wave1 == 1}:
    - meteor_wave1_done
    - play_voc_wave_completed
  meteor_wave_done_done.2{current_player.shot_meteor_wave2 == 1}:
    - meteor_wave2_done
    - play_voc_wave_completed
  meteor_wave_done_done.2{current_player.shot_meteor_wave3 == 1}:
    - meteor_wave3_done
    - play_voc_wave_completed
  meteor_wave_done_done.2{current_player.shot_meteor_wave4 == 1}:
    - meteor_wave4_done
    - play_voc_wave_completed
  meteor_wave_done_done.2{current_player.shot_meteor_wave5 == 1}:
    - meteor_wave5_done
    - play_voc_wave_completed
    - light_eb
  meteor_wave_done_done.2{current_player.shot_meteor_wave6 == 1}:
    - meteor_wave6_done
    - play_voc_wave_completed
  meteor_wave_done_done.2{current_player.shot_meteor_wave7 == 1}:
    - meteor_wave7_done
    - play_voc_wave_completed
  meteor_wave_done_done.2{current_player.shot_meteor_wave8 == 1}:
    - meteor_wave8_done
    - play_voc_wave_completed
  meteor_wave_done_done.2{current_player.shot_meteor_wave9 == 1}:
    - meteor_wave9_done
    - activate_final_wave_wizard
  meteor_wave_done_done.2{current_player.training_heal_achieved==0}:
    - cancel_heal_powerup
  meteor_wave_done_done.1:
    - stop_meteor_wave
  check_protons{current_player.shot_proton_round1==0}:
    - restart_fire_protons
  earth_hit:
    - mw_lsing_earth_hit
    - mw_rsling_earth_hit
  left_orbit_hit{current_player.shot_mw_health==1}:
    - raise_diverter
  right_orbit_hit{current_player.shot_mw_health==1}:
    - raise_diverter
  timer_mw_health_diverter_complete:
    - drop_diverter
  timer_meteor_wave_finish_complete:
    - meteor_wave_done_done
  timer_meteor_wave_nuked_complete:
    - meteor_wave_done_done


light_player: 
  mode_meteor_wave_started: 
    GI: 
      color: 000000

  stop_meteor_wave: 
    GI: 
      color: ffdca3


random_event_player: 
  check_protons: 
    events:
      meteor1_proton_hit{current_player.shot_meteor1_light > 0}: 1
      meteor2_proton_hit{current_player.shot_meteor2_light > 0}: 1
      meteor3_proton_hit{current_player.shot_meteor3_light > 0}: 1
      meteor4_proton_hit{current_player.shot_meteor4_light > 0}: 1
    scope: player
  play_sfx_LMet: 
    events:
      play_sfx_LMet1: 1
      play_sfx_LMet2: 1
      play_sfx_LMet3: 1
      play_sfx_LMet4: 1
      play_sfx_LMet5: 1
      play_sfx_LMet6: 1
      play_sfx_LMet7: 1
    scope: player
  earth_hit: 
    events:
      play_sfx_EarthHit1: 1
      play_sfx_EarthHit2: 1
      play_sfx_EarthHit3: 1
    scope: player
  proton_fired: 
    events:
      play_sfx_LPF1: 1
      play_sfx_LPF2: 1
      play_sfx_LPF3: 1
      play_sfx_LPF4: 1
      play_sfx_LPF5: 1
    scope: player
  init_meteor1: 
    events:
      meteor1_init_tick1: 1
      meteor1_init_tick2: 1
      meteor1_init_tick3: 1
      meteor1_init_tick4: 1
    scope: player
  init_meteor2: 
    events:
      meteor2_init_tick1: 1
      meteor2_init_tick2: 1
      meteor2_init_tick3: 1
      meteor2_init_tick4: 1
    scope: player
  init_meteor3: 
    events:
      meteor3_init_tick1: 1
      meteor3_init_tick2: 1
      meteor3_init_tick3: 1
      meteor3_init_tick4: 1
    scope: player
  init_meteor4: 
    events:
      meteor4_init_tick1: 1
      meteor4_init_tick2: 1
      meteor4_init_tick3: 1
      meteor4_init_tick4: 1
    scope: player


segment_display_player: 
  mode_meteor_wave_started: 
    pf: 
      key: key_mw_pf1
      text: "{current_player.num_meteors_to_drop:0>2}"
      flashing: off

  check_meteor_wave.2: 
    pf: 
      key: key_mw_pf2
      text: "{current_player.num_meteors_to_drop:0>2}"
      flashing: off

  detonate_nuke: 
    pf: 
      key: key_mw_pf3
      text: "00"
      priority: 11000
      expire: 11000ms
      flashing: off
    player1: 
      key: key_mw_nuke1
      text: " "
      priority: 11000
      expire: 11000ms
      flashing: off
    player2: 
      key: key_mw_nuke2
      text: "  NUKED "
      priority: 11000
      expire: 11000ms
      flashing: all
    player3: 
      key: key_mw_nuke3
      text: " NUKED  "
      priority: 11000
      expire: 11000ms
      flashing: all
    player4: 
      key: key_mw_nuke4
      text: " "
      priority: 11000
      expire: 11000ms
      flashing: off

  mode_meteor_wave_started{current_player.number == 1 or current_player.number == 2}: 
    player1: 
      text: "METEOR "
      priority: 1000
      expire: 4000ms
      flashing: all
    player2: 
      text: "WAVE  "
      priority: 1000
      expire: 4000ms
      flashing: all
    player3: 
      text: "METEORS"
      priority: 10000
      flashing: off
    player4: 
      text: "{current_player.num_meteors_to_drop:0>2}"
      flashing: off

  mode_meteor_wave_started{current_player.number == 3 or current_player.number == 4}: 
    player1: 
      text: "METEORS"
      priority: 10000
      flashing: off
    player2: 
      text: "{current_player.num_meteors_to_drop:0>2}"
      flashing: off
    player3: 
      text: "METEOR "
      priority: 1000
      expire: 4000ms
      flashing: all
    player4: 
      text: "WAVE  "
      priority: 1000
      expire: 4000ms
      flashing: all

  check_meteor_wave.2{current_player.number == 1 or current_player.number == 2}: 
    player3: 
      text: "METEORS"
      priority: 10000
      flashing: off
    player4: 
      text: "{current_player.num_meteors_to_drop:0>2}"
      priority: 10000
      flashing: off

  check_meteor_wave.2{current_player.number == 3 or current_player.number == 4}: 
    player1: 
      text: "METEORS"
      priority: 10000
      flashing: off
    player2: 
      text: "{current_player.num_meteors_to_drop:0>2}"
      priority: 10000
      flashing: off


