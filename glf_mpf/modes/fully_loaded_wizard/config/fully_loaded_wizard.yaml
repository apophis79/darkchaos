sound_player: 
  play_sfx_cluster_fired: 
    sfx_cluster_fired: 
      key: key_flwiz_sfx_cluster_fired
      action: play
  play_sfx_launch: 
    sfx_launch: 
      key: key_flwiz_sfx_launch
      action: play


timers: 
  fully_loaded_message:
    start_value: 0
    end_value: 3
    direction: up
    control_events: 
      - event: mode_fully_loaded_wizard_started
        action: restart
    restart_on_complete: False
    start_running: False
    tick_interval: 3000ms
  flwiz_bumper_lights:
    start_value: 0
    end_value: 100000
    direction: up
    control_events: 
      - event: mode_fully_loaded_wizard_started
        action: restart
    restart_on_complete: False
    start_running: False
    tick_interval: 711ms

variable_player: 
  mode_fully_loaded_wizard_started: 
    wizard_fully_loaded_phase: 
      action: set
      int: 1
    wizard_mode_running: 
      action: set
      int: 1

  mode_fully_loaded_wizard_stopping: 
    wizard_mode_running: 
      action: set
      int: 0

  activate_flwiz_sjp: 
    flwiz_super_jp: 
      action: set
      int: 1

  flwiz_sjp_achieved: 
    wizard_fully_loaded_phase: 
      action: set
      int: 2

  activate_flwiz_sdjp: 
    flwiz_super_jp: 
      action: set
      int: 2




