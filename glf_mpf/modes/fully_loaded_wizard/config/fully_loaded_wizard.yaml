#config_version=6

mode:
  start_events: run_fully_loaded_wizard
  stop_events: mode_base_stopping, completed_fully_loaded_wizard
  priority: 2000

event_player: 
  mode_fully_loaded_wizard_started:
    - meteor_wave_music_stop
    - flwiz_music_start
    - flwiz_sjp1_show2
  mode_fully_loaded_wizard_stopping:
    - flwiz_music_stop
  timer_fully_loaded_message_complete:
    - release_scoop_hold
    - start_moon_multiball
    - delayed_release_moon_ball
  release_scoop_hold:
    - disable_scoop_hold
  s_TargetMystery1_active{current_player.shot_flwiz_proton1==1}:
    - flwiz_proton1_shot_hit
    - proton_fired
    - proton_fired_flash_show
    - play_sfx_jackpot
    - score_200000
  s_TargetMystery2_active{current_player.shot_flwiz_proton2==1}:
    - flwiz_proton2_shot_hit
    - proton_fired
    - proton_fired_flash_show
    - play_sfx_jackpot
    - score_200000
  s_TargetMystery3_active{current_player.shot_flwiz_proton3==1}:
    - flwiz_proton3_shot_hit
    - proton_fired
    - proton_fired_flash_show
    - play_sfx_jackpot
    - score_200000
  s_TargetMystery4_active{current_player.shot_flwiz_proton4==1}:
    - flwiz_proton4_shot_hit
    - proton_fired
    - proton_fired_flash_show
    - play_sfx_jackpot
    - score_200000
  s_TargetMystery5_active{current_player.shot_flwiz_proton5==1}:
    - flwiz_proton5_shot_hit
    - proton_fired
    - proton_fired_flash_show
    - play_sfx_jackpot
    - score_200000
  shield_bank_hit{current_player.shot_flwiz_proton6==1}:
    - flwiz_proton6_shot_hit
    - proton_fired
    - proton_fired_flash_show
    - play_sfx_jackpot
    - score_200000
  left_ramp_hit{current_player.shot_flwiz_cluster == 1 and current_player.wizard_fully_loaded_phase == 1}:
    - flwiz_phase1_cluster_hit
    - cluster_bomb_fired
    - cluster_bomb_flash
    - play_sfx_jackpot
    - play_sfx_cluster_fired
    - score_200000
  right_ramp_hit{current_player.shot_flwiz_moon == 1 and current_player.wizard_fully_loaded_phase == 1}:
    - flwiz_phase1_moon_hit
    - moon_missile_fired
    - play_sfx_jackpot
    - score_200000
  flwiz_shots_on_complete{current_player.wizard_fully_loaded_phase == 1}:
    - activate_flwiz_sjp
    - run_flwiz_scoop_show
  balldevice_scoop_ball_entered{current_player.wizard_fully_loaded_phase == 1 and current_player.flwiz_super_jp == 1}:
    - flwiz_sjp_achieved
    - stop_flwiz_scoop_show
    - restart_fully_loaded_shots
  flwiz_sjp_achieved:
    - add_flwiz_phase2_shot
    - play_sfx_super_jackpot
    - flwiz_sjp1_show1
    - flwiz_sjp1_show2
    - score_1000000
  s_TargetMystery1_active{current_player.shot_flwiz_proton1 == 1 and current_player.wizard_fully_loaded_phase == 2}:
    - flwiz_add_ball
    - add_flwiz_phase2_shot
    - flwiz_phase2_proton1_hit
    - play_flwiz_proton_show
    - play_sfx_jackpot
    - score_300000
  s_TargetMystery2_active{current_player.shot_flwiz_proton2 == 1 and current_player.wizard_fully_loaded_phase == 2}:
    - flwiz_add_ball
    - add_flwiz_phase2_shot
    - flwiz_phase2_proton2_hit
    - play_flwiz_proton_show
    - play_sfx_jackpot
    - score_300000
  s_TargetMystery3_active{current_player.shot_flwiz_proton3 == 1 and current_player.wizard_fully_loaded_phase == 2}:
    - flwiz_add_ball
    - add_flwiz_phase2_shot
    - flwiz_phase2_proton3_hit
    - play_flwiz_proton_show
    - play_sfx_jackpot
    - score_300000
  s_TargetMystery4_active{current_player.shot_flwiz_proton4 == 1 and current_player.wizard_fully_loaded_phase == 2}:
    - flwiz_add_ball
    - add_flwiz_phase2_shot
    - flwiz_phase2_proton4_hit
    - play_flwiz_proton_show
    - play_sfx_jackpot
    - score_300000
  s_TargetMystery5_active{current_player.shot_flwiz_proton5 == 1 and current_player.wizard_fully_loaded_phase == 2}:
    - flwiz_add_ball
    - add_flwiz_phase2_shot
    - flwiz_phase2_proton5_hit
    - play_flwiz_proton_show
    - play_sfx_jackpot
    - score_300000
  shield_bank_hit{current_player.shot_flwiz_proton6 == 1 and current_player.wizard_fully_loaded_phase == 2}:
    - flwiz_add_ball
    - add_flwiz_phase2_shot
    - flwiz_phase2_proton6_hit
    - play_flwiz_proton_show
    - play_sfx_jackpot
    - score_300000
  left_ramp_hit{current_player.shot_flwiz_cluster == 1 and current_player.wizard_fully_loaded_phase == 2}:
    - flwiz_add_ball
    - add_flwiz_phase2_shot
    - flwiz_phase2_cluster_hit
    - play_flwiz_cluster_show
    - play_sfx_jackpot
    - play_sfx_cluster_fired
    - score_300000
  right_ramp_hit{current_player.shot_flwiz_moon == 1 and current_player.wizard_fully_loaded_phase == 2}:
    - flwiz_add_ball
    - add_flwiz_phase2_shot
    - flwiz_phase2_moon_hit
    - play_flwiz_moon_show
    - play_sfx_jackpot
    - play_sfx_launch
    - score_300000
  flwiz_shots_on_complete{current_player.wizard_fully_loaded_phase == 2}:
    - activate_flwiz_sdjp
    - run_flwiz_scoop_show
    - enable_scoop_hold
  balldevice_scoop_ball_entered{current_player.flwiz_super_jp == 2}:
    - flwiz_sdjp_achieved
    - stop_flwiz_scoop_show
  flwiz_sdjp_achieved:
    - play_sfx_super_jackpot
    - flwiz_sjp2_show1
    - flwiz_sjp2_show2
    - flwiz_music_stop
    - score_2000000
  flwiz_finalize:
    - release_scoop_hold
    - completed_fully_loaded_wizard
  timer_flwiz_bumper_lights_tick{current_player.wizard_fully_loaded_phase == 1}:
    - flwiz_bumpers_show1
  timer_flwiz_bumper_lights_tick{current_player.wizard_fully_loaded_phase == 2}:
    - flwiz_bumpers_show2
  balldevice_moon_lock_ball_enter:
    - delayed_release_moon_ball
  ball_search_started:
    - release_moon_ball
  s_TargetShield1_active:
    - shield_bank_hit
  s_TargetShield2_active:
    - shield_bank_hit
  s_TargetShield3_active:
    - shield_bank_hit


multiballs: 
  multiball_flwiz:
    start_events: timer_fully_loaded_message_complete
    ball_count: 5
    ball_count_type: total
    shoot_again: 20000
    hurry_up_time: 3000
    grace_period: 2000
    ball_locks: 
  multiball_flwiz_2:
    start_events: flwiz_add_ball
    ball_count: 2
    ball_count_type: total
    shoot_again: 0
    hurry_up_time: 0
    grace_period: 0
    ball_locks: 

random_event_player: 
  add_flwiz_phase2_shot: 
    events:
      flwiz_proton1_ready{current_player.shot_flwiz_proton1 == 0}: 1
      flwiz_proton2_ready{current_player.shot_flwiz_proton2 == 0}: 1
      flwiz_proton3_ready{current_player.shot_flwiz_proton3 == 0}: 1
      flwiz_proton4_ready{current_player.shot_flwiz_proton4 == 0}: 1
      flwiz_proton5_ready{current_player.shot_flwiz_proton5 == 0}: 1
      flwiz_proton6_ready{current_player.shot_flwiz_proton6 == 0}: 1
      flwiz_cluster_ready{current_player.shot_flwiz_cluster == 0}: 1
      flwiz_moon_ready{current_player.shot_flwiz_moon == 0}: 1
    scope: player
  proton_fired: 
    events:
      play_sfx_LPF1: 1
      play_sfx_LPF2: 1
      play_sfx_LPF3: 1
      play_sfx_LPF4: 1
      play_sfx_LPF5: 1
    scope: player
  flwiz_bumpers_show2: 
    events:
      flwiz_bumper1_show2p: 1
      flwiz_bumper2_show2p: 1
      flwiz_bumper3_show2p: 1
      flwiz_bumper1_show2c: 1
      flwiz_bumper2_show2c: 1
      flwiz_bumper3_show2c: 1
      flwiz_bumper1_show2m: 1
      flwiz_bumper2_show2m: 1
      flwiz_bumper3_show2m: 1
    scope: player


segment_display_player: 
  mode_fully_loaded_wizard_started: 
    player1: 
      text: " FULLY "
      expire: 3000ms
      flashing: off
    player2: 
      text: " LOADED "
      expire: 3000ms
      flashing: off
    player3: 
      text: " WIZARD "
      expire: 3000ms
      flashing: off
    player4: 
      text: "  MODE  "
      expire: 3000ms
      flashing: off

  timer_fully_loaded_message_tick{device.timers.fully_loaded_message.ticks == 1}: 
    player1: 
      text: ""
      expire: 3000ms
      flashing: off
    player2: 
      text: "   EB   "
      expire: 3000ms
      flashing: all
    player3: 
      text: "  ADDED "
      expire: 3000ms
      flashing: all
    player4: 
      text: ""
      expire: 3000ms
      flashing: off

  timer_fully_loaded_message_tick{device.timers.fully_loaded_message.ticks == 2}: 
    player1: 
      text: ""
      expire: 3000ms
      flashing: off
    player2: 
      text: "HIT ALL"
      expire: 3000ms
      flashing: all
    player3: 
      text: "  SHOTS "
      expire: 3000ms
      flashing: all
    player4: 
      text: ""
      expire: 3000ms
      flashing: off


shot_groups: 
  flwiz_shots:
    shots: flwiz_proton1,flwiz_proton2,flwiz_proton3,flwiz_proton4,flwiz_proton5,flwiz_proton6,flwiz_cluster,flwiz_moon
    restart_events: restart_fully_loaded_shots

shots: 
  flwiz_shoot_again:
    profile: shoot_again
    show_tokens: 
      color: 0500ee
    reset_events: multiball_flwiz_shoot_again_ended
