#config_version=6

mode:
  start_events: new_ball_started, stop_meteor_wave, stop_training, wizard_mode_ended
  stop_events: stop_meteor_wave_qualify, mode_base_stopping, mode_eob_bonus_started, start_meteor_wave, start_training_select, wizard_mode_started
  priority: 1100

event_player: 
  mode_meteor_wave_qualify_started.1{current_player.shot_final_wave_wizard>0}:
    - stop_meteor_wave_qualify
  mode_meteor_wave_qualify_started{current_player.meteor_countdown_value == 0}:
    - reset_countdown_value
  mode_meteor_wave_qualify_started{current_player.meteor_countdown_value > 0}:
    - init_mwq_timer
  reset_countdown_value:
    - init_mwq_timer
  init_mwq_timer:
    - init_pf_display
  init_mwq_timer{current_player.ball_just_started == 0}:
    - start_mwq_timer
    - restart_mwq_no_switches_hit_timer
  s_Plunger1_inactive{current_player.ball_just_started == 1}:
    - start_mwq_timer
    - hide_super_spinner_count
    - hide_super_pops_count
  restart_tw_timer:
    - stop_mwq_timer
  play_mystery_show:
    - stop_mwq_timer
  play_eb_show:
    - stop_mwq_timer
  switches_hit{current_player.warping == 0}:
    - restart_mwq_no_switches_hit_timer
  both_flippers_down_state{current_player.warping == 0}:
    - restart_mwq_no_switches_hit_timer
  timer_mwq_no_switches_hit_complete:
    - stop_mwq_timer
    - check_exploit
  restart_mwq_no_switches_hit_timer:
    - start_mwq_timer
    - stop_mwq_exploit_timer
  check_exploit{device.state_machines.flipper_states.state!="flippers_down" and current_player.warping == 0}:
    - restart_mwq_exploit_timer
    - play_exploit_show
    - play_sfx_exploit_penalty
    - score_m100000
  timer_mwq_exploit_tick:
    - play_exploit_show
    - play_sfx_exploit_penalty
    - score_m100000
  stop_mwq_timer:
    - flash_mwq_display
  start_mwq_timer:
    - remove_flash_mwq_display
  timer_meteor_countdown_tick{device.timers.meteor_countdown.ticks == 4}:
    - meteor_wave_alert_show
    - backglass_wave_flash
  timer_meteor_countdown_tick{device.timers.meteor_countdown.ticks == 2}:
    - meteor_wave_alert_show
    - backglass_wave_flash
  timer_meteor_countdown_tick{device.timers.meteor_countdown.ticks == 1}:
    - stop_extra_ball
    - stop_mystery
    - stop_training_qualify
    - disable_scoop_hold
    - start_mwq_timer
  timer_meteor_countdown_complete:
    - start_meteor_wave
  meteor_wave_alert_show:
    - meteor_wave_alert_show1
    - meteor_wave_alert_show2
    - meteor_wave_alert_show3
    - meteor_wave_alert_show4
  s_Spinner_active{current_player.spin_multiplier == 1}:
    - check_super_spinner
    - restart_super_spinner_count_timer
  check_super_spinner.1{current_player.super_spinner_count <= 0}:
    - start_super_spinner
  timer_super_spinner_count_complete:
    - hide_super_spinner_count
  s_Bumper1_active:
    - pop_swtich_hit
  s_Bumper2_active:
    - pop_swtich_hit
  s_Bumper3_active:
    - pop_swtich_hit
  s_TopSlingshot_active:
    - pop_swtich_hit
  pop_swtich_hit{current_player.pop_multiplier == 1}:
    - check_super_pops
    - restart_super_pops_count_timer
  check_super_pops.1{current_player.super_pops_count <= 0}:
    - start_super_pops
  timer_super_pops_count_complete:
    - hide_super_pops_count
  mode_meteor_wave_qualify_stopping:
    - hide_super_spinner_count
    - hide_super_pops_count


segment_display_player: 
  init_pf_display: 
    pf: 
      text: "{device.timers.meteor_countdown.ticks:0>2}"
      flashing: off

  flash_mwq_display: 
    pf: 
      key: key_flash_mwq_display
      text: "{device.timers.meteor_countdown.ticks:0>2}"
      priority: 100
      flashing: all

  remove_flash_mwq_display: 
    pf: 
      key: key_flash_mwq_display
      action: remove
      flashing: off


show_player: 
  meteor_wave_alert_show1: 
    lsling_swap_2_2_b: 
      key: key_meteor_wave_alert_show1
      loops: 4
      show_tokens: 
        color1: "ff0000"
        color2: "ff9900"
        intensity: "30"
  meteor_wave_alert_show2: 
    rsling_swap_2_2_a: 
      key: key_meteor_wave_alert_show2
      loops: 4
      show_tokens: 
        color1: "ff0000"
        color2: "ff9900"
        intensity: "30"
  meteor_wave_alert_show3: 
    lsling_swap_2_2_a: 
      key: key_meteor_wave_alert_show3
      loops: 4
      show_tokens: 
        color1: "ff0000"
        color2: "ff9900"
        intensity: "30"
  meteor_wave_alert_show4: 
    rsling_swap_2_2_b: 
      key: key_meteor_wave_alert_show4
      loops: 4
      show_tokens: 
        color1: "ff0000"
        color2: "ff9900"
        intensity: "30"
  magnet_activated_gi: 
    flash_color_fadeout: 
      key: key_ts_mag_gi
      priority: 100
      loops: 2
      speed: 4.6
      show_tokens: 
        lights: "GI"
        color: "ffedd2"
  flash_mwq_display: 
    flash_color_with_fade: 
      key: key_flash_mwq_display
      priority: 5000
      speed: 8
      show_tokens: 
        lights: "tInlaneGI"
        color: "ffedd2"
        fade: "300"
  remove_flash_mwq_display: 
    flash_color_with_fade: 
      action: stop
      key: key_flash_mwq_display
      priority: 5000
      speed: 8
      show_tokens: 
        lights: "tInlaneGI"
        color: "ffedd2"
        fade: "300"


sound_player: 
  timer_meteor_countdown_tick{device.timers.meteor_countdown.ticks == 4}: 
    voc_wave_incoming: 
      key: key_voc_wave_incoming
      action: play


timers: 
  meteor_countdown:
    start_value: current_player.meteor_countdown_value
    end_value: 0
    direction: down
    control_events: 
      - event: init_mwq_timer
        action: jump
        value: current_player.meteor_countdown_value
      - event: start_mwq_timer
        action: start
      - event: stop_mwq_timer
        action: stop
    restart_on_complete: False
    start_running: False
    tick_interval: 1000ms
  mwq_no_switches_hit:
    start_value: 0
    end_value: 7
    direction: up
    control_events: 
      - event: restart_mwq_no_switches_hit_timer
        action: restart
      - event: stop_mwq_no_switches_hit_timer
        action: stop
    restart_on_complete: False
    start_running: False
    tick_interval: 1000ms
  mwq_exploit:
    start_value: 0
    end_value: 100
    direction: up
    control_events: 
      - event: restart_mwq_exploit_timer
        action: restart
      - event: stop_mwq_exploit_timer
        action: stop
    restart_on_complete: False
    start_running: False
    tick_interval: 6000ms
  super_spinner_count:
    start_value: 0
    end_value: 2
    direction: up
    control_events: 
      - event: restart_super_spinner_count_timer
        action: restart
    restart_on_complete: False
    start_running: False
    tick_interval: 1000ms
  super_pops_count:
    start_value: 0
    end_value: 2
    direction: up
    control_events: 
      - event: restart_super_pops_count_timer
        action: restart
    restart_on_complete: False
    start_running: False
    tick_interval: 1000ms

variable_player: 
  reset_countdown_value: 
    meteor_countdown_value: 
      action: set
      int: 45

  timer_meteor_countdown_tick: 
    meteor_countdown_value: 
      action: set
      int: device.timers.meteor_countdown.ticks

  timer_meteor_countdown_complete: 
    meteor_countdown_value: 
      action: set
      int: 0

  timer_mwq_no_switches_hit_complete: 
    no_switches_hit_pause: 
      action: set
      int: 1

  restart_mwq_no_switches_hit_timer: 
    no_switches_hit_pause: 
      action: set
      int: 0

  check_super_spinner.2: 
    super_spinner_count: 
      action: add
      int: -1

  check_super_pops.2: 
    super_pops_count: 
      action: add
      int: -1




