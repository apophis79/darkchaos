  bonus_light_pr3: 
    LPR3: 
      color: 00dddd

  bonus_light_pr4: 
    LPR4: 
      color: 00dddd

  bonus_light_pr5: 
    LPR5: 
      color: 00dddd

  bonus_light_pr6: 
    LPR6: 
