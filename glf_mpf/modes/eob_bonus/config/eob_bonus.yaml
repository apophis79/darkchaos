#config_version=6

mode:
  start_events: ball_ending{game.tilted == False}
  stop_events: bonus_finished
  priority: 150
  use_wait_queue: true

combo_switches: 
  bonus_skip:
    switches_1: s_LeftFlipperButton
    switches_2: s_RightFlipperButton
    events_when_both: 
      - skip_bonus_tally

event_player: 
  mode_eob_bonus_started:
    - run_bonus_started
  run_bonus_started:
    - check_bonus_bomb1
    - check_bonus_missile1
    - check_bonus_proton1
    - check_bonus_waves
  check_bonus_bomb1{current_player.shot_cluster_bomb1 == 1}:
    - add_bonus_bomb
    - check_bonus_bomb2
    - bonus_light_cr1
  check_bonus_bomb2{current_player.shot_cluster_bomb2 == 1}:
    - add_bonus_bomb
    - bonus_light_cr2
  check_bonus_missile1{current_player.shot_moon_missile1 == 1}:
    - add_bonus_missile
    - check_bonus_missile2
    - bonus_light_mr1
  check_bonus_missile2{current_player.shot_moon_missile2 == 1}:
    - add_bonus_missile
    - bonus_light_mr2
  check_bonus_proton1{current_player.shot_proton_round1 == 1}:
    - add_bonus_proton
    - check_bonus_proton2
    - bonus_light_pr1
  check_bonus_proton2{current_player.shot_proton_round2 == 1}:
    - add_bonus_proton
    - check_bonus_proton3
    - bonus_light_pr2
  check_bonus_proton3{current_player.shot_proton_round3 == 1}:
    - add_bonus_proton
    - check_bonus_proton4
    - bonus_light_pr3
  check_bonus_proton4{current_player.shot_proton_round4 == 1}:
    - add_bonus_proton
    - check_bonus_proton5
    - bonus_light_pr4
  check_bonus_proton5{current_player.shot_proton_round5 == 1}:
    - add_bonus_proton
    - check_bonus_proton6
    - bonus_light_pr5
  check_bonus_proton6{current_player.shot_proton_round6 == 1}:
    - add_bonus_proton
    - bonus_light_pr6
  check_bonus_waves{current_player.shot_meteor_wave1 == 2}:
    - bonus_light_w1
  check_bonus_waves{current_player.shot_meteor_wave2 == 2}:
    - bonus_light_w2
  check_bonus_waves{current_player.shot_meteor_wave3 == 2}:
    - bonus_light_w3
  check_bonus_waves{current_player.shot_meteor_wave4 == 2}:
    - bonus_light_w4
  check_bonus_waves{current_player.shot_meteor_wave5 == 2}:
    - bonus_light_w5
  check_bonus_waves{current_player.shot_meteor_wave6 == 2}:
    - bonus_light_w6
  check_bonus_waves{current_player.shot_meteor_wave7 == 2}:
    - bonus_light_w7
  check_bonus_waves{current_player.shot_meteor_wave8 == 2}:
    - bonus_light_w8
  check_bonus_waves{current_player.shot_meteor_wave9 == 2}:
    - bonus_light_w9
  timer_bonus_tick{device.timers.bonus.ticks == 17}:
    - calc_bonus_total
  calc_bonus_total:
    - score_bonus_total
  timer_bonus_tick{device.timers.bonus.ticks == 2 and current_player.bonus_multiplier == 2}:
    - bonus_2x
  timer_bonus_tick{device.timers.bonus.ticks == 3}:
    - bonus_tally1
    - restart_sfx_tally_alt
  timer_bonus_tick{device.timers.bonus.ticks == 6}:
    - bonus_tally2
    - restart_sfx_tally_alt
  timer_bonus_tick{device.timers.bonus.ticks == 9}:
    - bonus_tally3
    - restart_sfx_tally_alt
  timer_bonus_tick{device.timers.bonus.ticks == 12}:
    - bonus_tally4
    - restart_sfx_tally_alt
  timer_bonus_tick{device.timers.bonus.ticks == 15}:
    - bonus_tally5
    - restart_sfx_tally_alt
  timer_bonus_tick{device.timers.bonus.ticks == 18}:
    - bonus_tally6
    - restart_sfx_tally_alt
  restart_sfx_tally_alt:
    - stop_sfx_tally_alt
  stop_sfx_tally_alt:
    - play_sfx_tally_alt
  timer_bonus_complete:
    - bonus_finished
  skip_bonus_tally:
    - comboflip_hit


