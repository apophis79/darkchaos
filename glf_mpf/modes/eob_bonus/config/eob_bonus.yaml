      color: dd0400


segment_display_player: 
  run_bonus_started: 
    player1: 
      text: "BONUS  "
      flashing: off
    player2: 
      text: ""
      flashing: off
    player3: 
      text: ""
      flashing: off
    player4: 
      text: ""
      flashing: off

  bonus_2x: 
    player4: 
      text: " X 2  "
      priority: 5005
      flashing: off

  timer_bonus_tick{device.timers.bonus.ticks == 3}: 
    player2: 
      text: "WAVES"
      priority: 5010
      flashing: all
    player3: 
      text: "{current_player.bonus_waves:0>2}"
      priority: 5010
      flashing: all

  timer_bonus_tick{device.timers.bonus.ticks == 6}: 
    player2: 
      text: "TRAINING"
      priority: 5020
      flashing: all
    player3: 
      text: "{current_player.bonus_training:0>2}"
      priority: 5020
      flashing: all

  timer_bonus_tick{device.timers.bonus.ticks == 9}: 
    player2: 
      text: "BOMBS"
      priority: 5030
      flashing: all
    player3: 
      text: "{current_player.bonus_bombs:0>2}"
      priority: 5030
      flashing: all

  timer_bonus_tick{device.timers.bonus.ticks == 12}: 
    player2: 
      text: "MISSILES"
      priority: 5040
      flashing: all
    player3: 
      text: "{current_player.bonus_missiles:0>2}"
      priority: 5040
      flashing: all

  timer_bonus_tick{device.timers.bonus.ticks == 15}: 
    player2: 
      text: "PROTONS"
      priority: 5050
      flashing: all
    player3: 
      text: "{current_player.bonus_protons:0>2}"
      priority: 5050
      flashing: all

  timer_bonus_tick{device.timers.bonus.ticks == 18}: 
    player2: 
      text: "TOTAL"
      priority: 5060
      flashing: off
    player3: 
      text: "{current_player.bonus_total:0>2}"
      priority: 5060
      flashing: all
    player4: 
      text: ""
      priority: 5060
      flashing: off


show_player: 
  run_bonus_started: 
    gi_spin1_cw: 
      key: key_bonus_show
      show_tokens: 
        intensity: 100
  bonus_tally1: 
    flash_color: 
      key: key_tally1_show
      loops: 6
      speed: 13
      show_tokens: 
        lights: tWaves
        color: dd0400
  bonus_tally2: 
    flash_color: 
      key: key_tally2_show
      loops: 6
      speed: 13
      show_tokens: 
        lights: LX
        color: ffae00
  bonus_tally3: 
    flash_color: 
      key: key_tally3_show
      loops: 6
      speed: 13
      show_tokens: 
        lights: tClusterAll
        color: dd00dd
  bonus_tally4: 
    flash_color: 
      key: key_tally4_show
      loops: 6
      speed: 13
      show_tokens: 
        lights: tMoonAll
        color: ccbb00
  bonus_tally5: 
    flash_color: 
      key: key_tally5_show
      loops: 6
      speed: 13
      show_tokens: 
        lights: tProtonAll
        color: 00dddd


slide_player: 
  run_bonus_started.2: 
    bonus:
      action: play
      expire: 0s


sound_player: 
  stop_sfx_tally_alt: 
    sfx_tally_alt: 
      key: key_sfx_tally_alt
      action: stop
  play_sfx_tally_alt: 
    sfx_tally_alt: 
      key: key_sfx_tally_alt
      action: play


timers: 
  bonus:
    start_value: 0
    end_value: 24
    direction: up
    control_events: 
      - event: run_bonus_started
        action: restart
      - event: skip_bonus_tally{current_player.bonus_comboflip_block==0 and device.timers.bonus.ticks < 16}
        action: jump
        value: 16
    restart_on_complete: False
    start_running: False
    tick_interval: 333ms

variable_player: 
  run_bonus_started: 
    bonus_bombs: 
      action: set
      int: 0
    bonus_missiles: 
      action: set
      int: 0
    bonus_protons: 
      action: set
      int: 0
    bonus_total: 
      action: set
      int: 0
    bonus_waves: 
      action: set
      int: 100000 * current_player.num_waves_completed_this_ball * current_player.num_waves_completed
    bonus_training: 
      action: set
      int: 250000 * current_player.training_total_achieved
    bonus_comboflip_block: 
      action: set
      int: 0

  comboflip_hit: 
    bonus_comboflip_block: 
      action: set
      int: 1

  add_bonus_bomb: 
    bonus_bombs: 
      action: add
      int: 250000

  add_bonus_missile: 
    bonus_missiles: 
      action: add
      int: 250000

  add_bonus_proton: 
    bonus_protons: 
      action: add
      int: 50000

  calc_bonus_total: 
    bonus_total: 
      action: set
      int: (current_player.bonus_waves + current_player.bonus_training + current_player.bonus_bombs + current_player.bonus_missiles + current_player.bonus_protons) * current_player.bonus_multiplier

  score_bonus_total: 
    score: 
      action: add
      int: current_player.bonus_total




