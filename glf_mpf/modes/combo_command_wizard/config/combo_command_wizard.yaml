timers: 
  combo_command_message:
    start_value: 0
    end_value: 3
    direction: up
    control_events: 
      - event: mode_combo_command_wizard_started
        action: restart
    restart_on_complete: False
    start_running: False
    tick_interval: 3400ms
  ccwiz_bumper_lights:
    start_value: 0
    end_value: 100000
    direction: up
    control_events: 
      - event: mode_combo_command_wizard_started
        action: restart
    restart_on_complete: False
    start_running: False
    tick_interval: 711ms

variable_player: 
  mode_combo_command_wizard_started: 
    wizard_combo_command_phase: 
      action: set
      int: 1
    wizard_mode_running: 
      action: set
      int: 1

  mode_combo_command_wizard_stopping: 
    wizard_mode_running: 
      action: set
      int: 0

  activate_ccwiz_sjp: 
    ccwiz_super_jp: 
      action: set
      int: 1

  ccwiz_sjp_achieved: 
    wizard_combo_command_phase: 
      action: set
      int: 2

  activate_ccwiz_sdjp: 
    ccwiz_super_jp: 
      action: set
      int: 2




