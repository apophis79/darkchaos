#config_version=6

mode:
  start_events: run_combo_command_wizard
  stop_events: mode_base_stopping, completed_combo_command_wizard
  priority: 3000

event_player: 
  mode_combo_command_wizard_started:
    - meteor_wave_music_stop
    - ccwiz_music_start
    - ccwiz_sjp1_show2
  mode_combo_command_wizard_stopping:
    - ccwiz_music_stop
  timer_combo_command_message_complete:
    - release_scoop_hold
    - start_moon_multiball
    - delayed_release_moon_ball
  release_scoop_hold:
    - disable_scoop_hold
  left_side_hit{current_player.shot_combo_command1 == 1 and current_player.wizard_combo_command_phase == 1}:
    - play_sfx_jackpot
    - ccwiz_shot_phase1_show
    - ccwiz_flash_phase1_show
    - score_200000
  left_orbit_hit{current_player.shot_combo_command2 == 1 and current_player.wizard_combo_command_phase == 1}:
    - play_sfx_jackpot
    - ccwiz_shot_phase1_show
    - ccwiz_flash_phase1_show
    - score_200000
  left_ramp_hit{current_player.shot_combo_command3 == 1 and current_player.wizard_combo_command_phase == 1}:
    - play_sfx_jackpot
    - ccwiz_shot_phase1_show
    - ccwiz_flash_phase1_show
    - score_200000
  inner_orbit_hit{current_player.shot_combo_command4 == 1 and current_player.wizard_combo_command_phase == 1}:
    - play_sfx_jackpot
    - ccwiz_shot_phase1_show
    - ccwiz_flash_phase1_show
    - score_200000
  center_orbit_left_hit{current_player.shot_combo_command5 == 1 and current_player.wizard_combo_command_phase == 1}:
    - play_sfx_jackpot
    - ccwiz_shot_phase1_show
    - ccwiz_flash_phase1_show
    - score_200000
  center_orbit_right_hit{current_player.shot_combo_command6 == 1 and current_player.wizard_combo_command_phase == 1}:
    - play_sfx_jackpot
    - ccwiz_shot_phase1_show
    - ccwiz_flash_phase1_show
    - score_200000
  right_ramp_hit{current_player.shot_combo_command7 == 1 and current_player.wizard_combo_command_phase == 1}:
    - play_sfx_jackpot
    - ccwiz_shot_phase1_show
    - ccwiz_flash_phase1_show
    - score_200000
  right_orbit_hit{current_player.shot_combo_command8 == 1 and current_player.wizard_combo_command_phase == 1}:
    - play_sfx_jackpot
    - ccwiz_shot_phase1_show
    - ccwiz_flash_phase1_show
    - score_200000
  ccwiz_shots_on_complete{current_player.wizard_combo_command_phase == 1}:
    - activate_ccwiz_sjp
    - run_ccwiz_scoop_show
  balldevice_scoop_ball_entered{current_player.wizard_combo_command_phase == 1 and current_player.ccwiz_super_jp == 1}:
    - ccwiz_sjp_achieved
    - stop_ccwiz_scoop_show
    - restart_combos_command_shots
  ccwiz_sjp_achieved:
    - add_ccwiz_phase2_shot
    - play_sfx_super_jackpot
    - ccwiz_sjp1_show1
    - ccwiz_sjp1_show2
    - score_1000000
  left_side_hit{current_player.shot_combo_command1 == 1 and current_player.wizard_combo_command_phase == 2}:
    - ccwiz_add_ball
    - add_ccwiz_phase2_shot
    - play_sfx_jackpot
    - ccwiz_shot_phase2_show1
    - ccwiz_flash_phase2_show1
    - score_300000
  left_orbit_hit{current_player.shot_combo_command2 == 1 and current_player.wizard_combo_command_phase == 2}:
    - ccwiz_add_ball
    - add_ccwiz_phase2_shot
    - play_sfx_jackpot
    - ccwiz_shot_phase2_show8
    - ccwiz_flash_phase2_show8
    - score_300000
  left_ramp_hit{current_player.shot_combo_command3 == 1 and current_player.wizard_combo_command_phase == 2}:
    - ccwiz_add_ball
    - add_ccwiz_phase2_shot
    - play_sfx_jackpot
    - ccwiz_shot_phase2_show2
    - ccwiz_flash_phase2_show2
    - score_300000
  inner_orbit_hit{current_player.shot_combo_command4 == 1 and current_player.wizard_combo_command_phase == 2}:
    - ccwiz_add_ball
    - add_ccwiz_phase2_shot
    - play_sfx_jackpot
    - ccwiz_shot_phase2_show5
    - ccwiz_flash_phase2_show5
    - score_300000
  center_orbit_left_hit{current_player.shot_combo_command5 == 1 and current_player.wizard_combo_command_phase == 2}:
    - ccwiz_add_ball
    - add_ccwiz_phase2_shot
    - play_sfx_jackpot
    - ccwiz_shot_phase2_show4
    - ccwiz_flash_phase2_show4
    - score_300000
  center_orbit_right_hit{current_player.shot_combo_command6 == 1 and current_player.wizard_combo_command_phase == 2}:
    - ccwiz_add_ball
    - add_ccwiz_phase2_shot
    - play_sfx_jackpot
    - ccwiz_shot_phase2_show6
    - ccwiz_flash_phase2_show6
    - score_300000
  right_ramp_hit{current_player.shot_combo_command7 == 1 and current_player.wizard_combo_command_phase == 2}:
    - ccwiz_add_ball
    - add_ccwiz_phase2_shot
    - play_sfx_jackpot
    - ccwiz_shot_phase2_show3
    - ccwiz_flash_phase2_show3
    - score_300000
  right_orbit_hit{current_player.shot_combo_command8 == 1 and current_player.wizard_combo_command_phase == 2}:
    - ccwiz_add_ball
    - add_ccwiz_phase2_shot
    - play_sfx_jackpot
    - ccwiz_shot_phase2_show7
    - ccwiz_flash_phase2_show7
    - score_300000
  ccwiz_shots_on_complete{current_player.wizard_combo_command_phase == 2}:
    - activate_ccwiz_sdjp
    - run_ccwiz_scoop_show
    - enable_scoop_hold
  balldevice_scoop_ball_entered{current_player.ccwiz_super_jp == 2}:
    - ccwiz_sdjp_achieved
    - stop_ccwiz_scoop_show
  ccwiz_sdjp_achieved:
    - play_sfx_super_jackpot
    - ccwiz_sjp2_show1
    - ccwiz_sjp2_show2
    - ccwiz_music_stop
    - score_2000000
  ccwiz_finalize:
    - release_scoop_hold
    - completed_combo_command_wizard
  timer_ccwiz_bumper_lights_tick{current_player.wizard_combo_command_phase == 1}:
    - ccwiz_bumpers_show1
  timer_ccwiz_bumper_lights_tick{current_player.wizard_combo_command_phase == 2}:
    - ccwiz_bumpers_show2
  balldevice_moon_lock_ball_enter:
    - delayed_release_moon_ball
  ball_search_started:
    - release_moon_ball


multiballs: 
  multiball_ccwiz:
    start_events: timer_combo_command_message_complete
    ball_count: 5
    ball_count_type: total
    shoot_again: 20000
    hurry_up_time: 3000
    grace_period: 2000
    ball_locks: 
  multiball_ccwiz_2:
    start_events: ccwiz_add_ball
    ball_count: 2
    ball_count_type: total
    shoot_again: 0
    hurry_up_time: 0
    grace_period: 0
    ball_locks: 

random_event_player: 
  add_ccwiz_phase2_shot: 
    events:
      combo_command1_ready{current_player.shot_combo_command1 == 0}: 1
      combo_command2_ready{current_player.shot_combo_command2 == 0}: 1
      combo_command3_ready{current_player.shot_combo_command3 == 0}: 1
      combo_command4_ready{current_player.shot_combo_command4 == 0}: 1
      combo_command5_ready{current_player.shot_combo_command5 == 0}: 1
      combo_command6_ready{current_player.shot_combo_command6 == 0}: 1
      combo_command7_ready{current_player.shot_combo_command7 == 0}: 1
      combo_command8_ready{current_player.shot_combo_command8 == 0}: 1
    scope: player
  ccwiz_bumpers_show2: 
    events:
      ccwiz_bumper1_show2: 1
      ccwiz_bumper2_show2: 1
      ccwiz_bumper3_show2: 1
    scope: player


segment_display_player: 
  mode_combo_command_wizard_started: 
    player1: 
      text: " COMBO "
      expire: 3400ms
      flashing: off
    player2: 
      text: "COMMAND"
      expire: 3400ms
      flashing: off
    player3: 
      text: " WIZARD "
      expire: 3400ms
      flashing: off
    player4: 
      text: "  MODE  "
      expire: 3400ms
      flashing: off

  timer_combo_command_message_tick{device.timers.combo_command_message.ticks == 1}: 
    player1: 
      text: ""
      expire: 3400ms
      flashing: off
    player2: 
      text: "   EB   "
      expire: 3400ms
      flashing: all
    player3: 
      text: "  ADDED "
      expire: 3400ms
      flashing: all
    player4: 
      text: ""
      expire: 3400ms
      flashing: off

  timer_combo_command_message_tick{device.timers.combo_command_message.ticks == 2}: 
    player1: 
      text: ""
      expire: 3400ms
      flashing: off
    player2: 
      text: "HIT ALL"
      expire: 3400ms
      flashing: all
    player3: 
      text: "  SHOTS "
      expire: 3400ms
      flashing: all
    player4: 
      text: ""
      expire: 3400ms
      flashing: off


shot_groups: 
  ccwiz_shots:
    shots: combo_command1,combo_command2,combo_command3,combo_command4,combo_command5,combo_command6,combo_command7,combo_command8
    restart_events: restart_combos_command_shots

shots: 
  ccwiz_shoot_again:
    profile: shoot_again
    show_tokens: 
      color: 0500ee
    reset_events: multiball_ccwiz_shoot_again_ended
    control_events: 
      - events: mode_combo_command_wizard_started
        state: 1
      - events: multiball_ccwiz_hurry_up
        state: 2
  combo_command1:
    profile: combo_command
    show_tokens: 
      lights: LS1
      color: ffb46b
    control_events: 
      - events: combo_command1_ready, mode_combo_command_wizard_started
        state: 1
      - events: left_side_hit{current_player.shot_combo_command1==1}
        state: 2
  combo_command2:
    profile: combo_command
    show_tokens: 
      lights: LS2
      color: ffb46b
    control_events: 
      - events: combo_command2_ready, mode_combo_command_wizard_started
        state: 1
      - events: left_orbit_hit{current_player.shot_combo_command2==1}
        state: 2
  combo_command3:
    profile: combo_command
    show_tokens: 
      lights: LS3
      color: ffb46b
    control_events: 
      - events: combo_command3_ready, mode_combo_command_wizard_started
        state: 1
      - events: left_ramp_hit{current_player.shot_combo_command3==1}
        state: 2
  combo_command4:
    profile: combo_command
    show_tokens: 
      lights: LS4
      color: ffb46b
    control_events: 
      - events: combo_command4_ready, mode_combo_command_wizard_started
        state: 1
      - events: inner_orbit_hit{current_player.shot_combo_command4==1}
        state: 2
  combo_command5:
    profile: combo_command
    show_tokens: 
      lights: LPC4
      color: ffb46b
    control_events: 
      - events: combo_command5_ready, mode_combo_command_wizard_started
        state: 1
      - events: center_orbit_left_hit{current_player.shot_combo_command5==1}
        state: 2
  combo_command6:
    profile: combo_command
    show_tokens: 
      lights: LPC5
      color: ffb46b
    control_events: 
      - events: combo_command6_ready, mode_combo_command_wizard_started
        state: 1
      - events: center_orbit_right_hit{current_player.shot_combo_command6==1}
        state: 2
  combo_command7:
    profile: combo_command
    show_tokens: 
      lights: LS5
      color: ffb46b
    control_events: 
      - events: combo_command7_ready, mode_combo_command_wizard_started
        state: 1
      - events: right_ramp_hit{current_player.shot_combo_command7==1}
        state: 2
  combo_command8:
    profile: combo_command
    show_tokens: 
      lights: LS6
      color: ffb46b
    control_events: 
      - events: combo_command8_ready, mode_combo_command_wizard_started
        state: 1
      - events: right_orbit_hit{current_player.shot_combo_command8==1}
        state: 2

