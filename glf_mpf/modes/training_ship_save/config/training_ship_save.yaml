timers: 
  training_ship_save:
    start_value: 69
    end_value: 0
    direction: down
    control_events: 
      - event: init_training
        action: restart
    restart_on_complete: False
    start_running: False
    tick_interval: 1000ms

variable_player: 
  light_ship_charge1: 
    shot_training_select_ship_charge1: 
      action: set
      int: 3

  light_ship_charge2: 
    shot_training_select_ship_charge2: 
      action: set
      int: 3

  light_ship_charge3: 
    shot_training_select_ship_charge3: 
      action: set
      int: 3

  training_achieved: 
    training_ship_save_achieved: 
      action: set
      int: 1
    training_total_achieved: 
      action: add
      int: 1
    training_just_finished: 
      action: set
      int: 1

  start_moon_multiball: 
    training_moon_missile_used: 
      action: set
      int: 1




