#config_version=6

mode:
  start_events: start_training_ship_save
  stop_events: mode_base_stopping, stop_training
  priority: 700

combo_switches: 
  cancel_training_ss:
    switches_1: s_LeftFlipperButton
    switches_2: s_RightFlipperButton
    events_when_both: 
      - stop_training
      - play_voc_training_canceled
      - training_stopped
    hold_time: 3000ms
  cancel_training_warning_ss:
    switches_1: s_LeftFlipperButton
    switches_2: s_RightFlipperButton
    events_when_both: 
      - training_cancel_warning
    events_when_inactive: 
      - training_cancel_warning_stop
    hold_time: 1500ms

event_player: 
  mode_training_ship_save_started:
    - init_training
    - play_lsling_training
    - play_rsling_training
  right_orbit_hit{current_player.shot_training_ship_charge1 == 0}:
    - light_ship_charge1
    - flash_gi
    - play_sfx_LS
    - score_200000
  right_orbit_hit{current_player.shot_training_ship_charge1 == 1 and current_player.shot_training_ship_charge2 == 0}:
    - light_ship_charge2
    - flash_gi
    - play_sfx_LS
    - score_300000
  right_orbit_hit{current_player.shot_training_ship_charge2 == 1 and current_player.shot_training_ship_charge3 == 0}:
    - light_ship_charge3
    - play_sfx_LS
    - score_500000
  light_ship_charge3:
    - training_achieved
    - play_sfx_super_jackpot
  play_sfx_LS:
    - play_sfx_LS_during_training
  training_achieved:
    - stop_training
    - training_stopped
  timer_training_ship_save_complete:
    - stop_training
    - training_stopped
    - play_voc_training_incomplete
  timer_training_ship_save_tick:
    - flicker_gi
  balldevice_moon_lock_ball_enter{device.ball_devices.moon_lock.balls > current_player.moon_launch_locked_balls}:
    - delayed_release_moon_ball


random_event_player: 
  flicker_gi: 
    events:
      play_flicker_gi01: 1
      play_flicker_gi02: 1
      play_flicker_gi03: 1
      play_flicker_gi04: 1
      play_flicker_gi05: 1
      play_flicker_gi06: 1
      play_flicker_gi07: 1
      play_flicker_gi08: 1
      play_flicker_gi09: 1
      play_flicker_gi10: 1
      play_flicker_gi11: 1
      play_flicker_gi12: 1
      play_flicker_gi13: 1
      play_flicker_gi14: 1
      play_flicker_gi15: 1
      play_flicker_gi16: 1
      play_flicker_gi17: 1
      play_flicker_gi18: 1
      play_flicker_gi19: 1
      play_flicker_gi20: 1
      play_flicker_gi21: 1
      play_flicker_gi22: 1
    scope: player


segment_display_player: 
  init_training: 
    player1: 
      text: ""
      expire: 5000ms
      flashing: off
    player2: 
      text: "TRAIN "
      expire: 5000ms
      flashing: off
    player3: 
      text: "SAVER"
      expire: 5000ms
      flashing: off
    player4: 
      text: ""
      expire: 5000ms
      flashing: off
    pf: 
      text: "{device.timers.training_ship_save.ticks:0>2}"
      flashing: off


shots: 
  training_ship_charge1:
    profile: training_powerups
    show_tokens: 
      lights: LF1
      color: 0500ee
    control_events: 
      - events: light_ship_charge1
        state: 1
  training_ship_charge2:
    profile: training_powerups
    show_tokens: 
      lights: LF2
      color: 0500ee
    control_events: 
