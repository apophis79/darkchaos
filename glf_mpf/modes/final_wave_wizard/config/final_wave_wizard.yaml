multiballs: 
  fwwiz:
    start_events: timer_final_wave_message_complete
    ball_count: 5
    ball_count_type: total
    shoot_again: 60000
    hurry_up_time: 5000
    grace_period: 500
    ball_locks: 
  fwwiz_2:
    start_events: fwwiz_add_ball
    ball_count: 1
    ball_count_type: add
    shoot_again: 0
    hurry_up_time: 0
    grace_period: 0
    ball_locks: 

random_event_player: 
  fwwiz_raise_meteor: 
    events:
      meteor1_raise{current_player.shot_fwwiz_meteor1 == 0}: 1
      meteor2_raise{current_player.shot_fwwiz_meteor2 == 0}: 1
      meteor3_raise{current_player.shot_fwwiz_meteor3 == 0}: 1
      meteor4_raise{current_player.shot_fwwiz_meteor4 == 0}: 1
    scope: player
  play_asteroid_flicker: 
    events:
      asteroid_flicker1: 1
      asteroid_flicker2: 1
      asteroid_flicker3: 1
      asteroid_flicker4: 1
    scope: player
  asteroid_hit: 
    events:
      play_sfx_LMet1: 1
      play_sfx_LMet2: 1
      play_sfx_LMet3: 1
      play_sfx_LMet4: 1
      play_sfx_LMet5: 1
      play_sfx_LMet6: 1
      play_sfx_LMet7: 1
    scope: player


queue_relay_player: 
  balldevice_trough_ball_eject_attempt{modes.final_wave_wizard.active and current_player.wizard_final_hit_count == 0}: 
    post: awaiting_wizard_show
    wait_for: explosion_done


segment_display_player: 
  begin_fwwiz: 
    player1: 
      text: "  THE  "
      expire: 3000ms
      flashing: off
    player2: 
      text: " FINAL "
      expire: 3000ms
      flashing: off
    player3: 
      text: "  WAVE  "
      expire: 3000ms
      flashing: off
    player4: 
      text: "IS HERE "
      expire: 3000ms
      flashing: off

  timer_final_wave_message_tick{device.timers.final_wave_message.ticks == 1}: 
    player1: 
      text: " RAMPS "
      expire: 3000ms
      flashing: all
    player2: 
      text: " ADD A  "
      expire: 3000ms
      flashing: all
    player3: 
      text: "  BALL  "
      expire: 3000ms
      flashing: all
    player4: 
      text: " "
      expire: 3000ms
      flashing: all

