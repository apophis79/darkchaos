      flashing: off
    player2: 
      text: "DESTROY"
      expire: 3000ms
      flashing: all
    player3: 
      text: "ASTEROID"
      expire: 3000ms
      flashing: all
    player4: 
      text: "--------"
      expire: 3000ms
