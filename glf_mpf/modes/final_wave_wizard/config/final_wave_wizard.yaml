sound_player: 
  asteroid_destroyed: 
    sfx_final_explosion: 
      key: key_sfx_final_explosion
      action: play
  begin_fwwiz: 
    sfx_final_wave_scoop: 
      key: key_sfx_final_wave_scoop
      action: play


timers: 
  final_wave_message:
    start_value: 0
    end_value: 3
    direction: up
    control_events: 
      - event: begin_fwwiz
        action: restart
    restart_on_complete: False
    start_running: False
    tick_interval: 3400ms
  fwwiz_start_meteors:
    start_value: 0
    end_value: 1
    direction: up
    control_events: 
      - event: timer_final_wave_message_complete
        action: restart
    restart_on_complete: False
    start_running: False
    tick_interval: 30000ms
  fwwiz_add_meteor:
    start_value: 0
    end_value: 2
    direction: up
    control_events: 
      - event: timer_fwwiz_start_meteors_complete
        action: restart
      - event: continue_fwwiz
        action: restart
      - event: fwwiz_add_meteor
        action: restart
    restart_on_complete: False
    start_running: False
    tick_interval: 400ms
  asteroid_explodes:
    start_value: 0
    end_value: 50
    direction: up
    control_events: 
      - event: asteroid_destroyed
        action: start
    restart_on_complete: False
    start_running: False
    tick_interval: 200ms
  final_wave_gi:
    start_value: 0
    end_value: 53
    direction: up
    control_events: 
      - event: mode_final_wave_wizard_started
        action: restart
      - event: timer_final_wave_gi_complete
        action: restart
      - event: asteroid_destroyed
        action: stop
    restart_on_complete: False
    start_running: False
    tick_interval: 500ms
  final_wave_flicker:
    start_value: 0
    end_value: 30
    direction: up
    control_events: 
      - event: start_asteroid_flicker
        action: restart
      - event: timer_final_wave_flicker_complete
        action: restart
      - event: asteroid_destroyed
        action: stop
    restart_on_complete: False
    start_running: False
    tick_interval: 1000ms

variable_player: 
  mode_final_wave_wizard_started: 
    wizard_mode_running: 
      action: set
      int: 1

  mode_final_wave_wizard_stopping: 
    wizard_mode_running: 
      action: set
      int: 0

  asteroid_hit{current_player.wizard_final_hit_count > 0}: 
    wizard_final_hit_count: 
      action: add
      int: -1

  detonate_nuke.3: 
    wizard_final_hit_count: 
      action: add
      int: -10

  detonate_nuke.2{current_player.wizard_final_hit_count < 0}: 
    wizard_final_hit_count: 
      action: set
      int: 0

  multiball_fwwiz_shoot_again_ended: 
    fwwiz_add_ball_ready: 
      action: set
      int: 1

  continue_fwwiz: 
    fwwiz_add_ball_ready: 
      action: set
      int: 1

  start_add_ball_fwwiz: 
    fwwiz_add_ball_ready: 
      action: set
      int: 1

  fwwiz_add_ball: 
    fwwiz_add_ball_ready: 
      action: set
      int: 2

  multiball_fwwiz_2_ended: 
    fwwiz_add_ball_ready: 
      action: set
      int: 1




