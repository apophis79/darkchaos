#config_version=6

mode:
  start_events: start_super_spinner, mystery_super_spinner
  stop_events: mode_base_stopping, stop_super_spinner, init_training
  priority: 700

event_player: 
  timer_super_spinner_complete:
    - stop_super_spinner


segment_display_player: 
  mode_super_spinner_started: 
    player1: 
      text: ""
      expire: 5000ms
      flashing: off
    player2: 
      text: " SUPER "
      expire: 5000ms
      flashing: all
    player3: 
      text: "SPINNER"
      expire: 5000ms
      flashing: all
    player4: 
      text: ""
      expire: 5000ms
      flashing: off


shots: 
  super_spinner:
    profile: super_spinner
    show_tokens: 
    reset_events: mode_super_spinner_stopping
    control_events: 
      - events: mode_super_spinner_started
        state: 1
      - events: timer_super_spinner_tick{device.timers.super_spinner.ticks == 55}
        state: 2

sound_player: 
  mode_super_spinner_started: 
    voc_super_spinner: 
      key: key_voc_super_spinner
      action: play


timers: 
  super_spinner:
    start_value: 0
    end_value: 60
    direction: up
    control_events: 
      - event: mode_super_spinner_started
        action: restart
    restart_on_complete: False
    start_running: False
    tick_interval: 1000ms

variable_player: 
  mode_super_spinner_started: 
    spin_multiplier: 
      action: set
      int: 69

  mode_super_spinner_stopping: 
    spin_multiplier: 
      action: set
      int: 1




