      - events: shields_selected{current_player.ts_hurry_up==1}, selection_hurry_up{device.state_machines.training_select.state=="shields"}
        state: 2

show_player: 
  mode_training_select_started: 
    flash_color_with_fade: 
      key: key_ts_gi
      speed: 2
      show_tokens: 
        lights: "GI"
        fade: "900"
        color: "ffdca3"
  skip_selected: 
    flash_color: 
      key: key_skip_gi
      priority: 100
      speed: 11
      show_tokens: 
        lights: "gi22"
        color: "ffffff"
  skip_unselected: 
    flash_color: 
      action: stop
      key: key_skip_gi
      speed: 13
      show_tokens: 
        lights: "gi22"
        color: "ffffff"


sound_player: 
  mode_training_select_started: 
    voc_select_option: 
      key: key_voc_select_option
      action: play


state_machines: 
  training_select:
    starting_state: heal
    states: 
      heal: 
        label: Select Heal State
        events_when_started: heal_selected, training_select_left{current_player.ts_last_move=="left" and current_player.training_heal_achieved==1}, training_select_right{current_player.ts_last_move=="right" and current_player.training_heal_achieved==1}
      cluster_bomb: 
        label: Select Cluster Bomb State
        events_when_started: cluster_bomb_selected, training_select_left{current_player.ts_last_move=="left" and current_player.training_cluster_bomb_achieved==1}, training_select_right{current_player.ts_last_move=="right" and current_player.training_cluster_bomb_achieved==1}
      proton_cannon: 
        label: Select Proton Cannon State
        events_when_started: proton_cannon_selected, training_select_left{current_player.ts_last_move=="left" and current_player.training_proton_cannon_achieved==1}, training_select_right{current_player.ts_last_move=="right" and current_player.training_proton_cannon_achieved==1}
      moon_missile: 
        label: Select Moon Missile State
        events_when_started: moon_missile_selected, training_select_left{current_player.ts_last_move=="left" and current_player.training_moon_missile_achieved==1}, training_select_right{current_player.ts_last_move=="right" and current_player.training_moon_missile_achieved==1}
      ship_save: 
        label: Select Ship Save State
        events_when_started: ship_save_selected, training_select_left{current_player.ts_last_move=="left" and current_player.training_ship_save_achieved==1}, training_select_right{current_player.ts_last_move=="right" and current_player.training_ship_save_achieved==1}
      shields: 
        label: Select Shields State
        events_when_started: shields_selected, training_select_left{current_player.ts_last_move=="left" and current_player.training_shields_achieved==1}, training_select_right{current_player.ts_last_move=="right" and current_player.training_shields_achieved==1}
      skip: 
        label: Skip State
        events_when_started: skip_selected
    transitions: 
      - source: heal
        target: cluster_bomb
        events: 
          - training_select_right
        events_when_transitioning: heal_unselected
      - source: cluster_bomb
        target: proton_cannon
        events: 
          - training_select_right
        events_when_transitioning: cluster_bomb_unselected
      - source: proton_cannon
        target: ship_save
        events: 
          - training_select_right
        events_when_transitioning: proton_cannon_unselected
      - source: ship_save
        target: shields
        events: 
          - training_select_right
        events_when_transitioning: ship_save_unselected
      - source: shields
        target: moon_missile
        events: 
          - training_select_right
        events_when_transitioning: shields_unselected
      - source: moon_missile
        target: skip
        events: 
          - training_select_right
        events_when_transitioning: moon_missile_unselected
      - source: skip
        target: heal
        events: 
          - training_select_right
        events_when_transitioning: skip_unselected
      - source: heal
        target: skip
        events: 
          - training_select_left
        events_when_transitioning: heal_unselected
      - source: cluster_bomb
        target: heal
        events: 
          - training_select_left
        events_when_transitioning: cluster_bomb_unselected
      - source: proton_cannon
        target: cluster_bomb
        events: 
          - training_select_left
        events_when_transitioning: proton_cannon_unselected
      - source: ship_save
        target: proton_cannon
        events: 
          - training_select_left
        events_when_transitioning: ship_save_unselected
      - source: shields
        target: ship_save
        events: 
          - training_select_left
        events_when_transitioning: shields_unselected
      - source: moon_missile
        target: shields
        events: 
          - training_select_left
        events_when_transitioning: moon_missile_unselected
      - source: skip
        target: moon_missile
        events: 
          - training_select_left
        events_when_transitioning: skip_unselected

timers: 
  training_select:
    start_value: 0
    end_value: 10
    direction: up
    control_events: 
      - event: mode_training_select_started
        action: restart
    restart_on_complete: False
    start_running: False
    tick_interval: 1000ms

variable_player: 
  mode_training_select_started: 
    ts_hurry_up: 
      action: set
      int: 0
    ts_last_move: 
      action: set
      string: "right"

  selection_hurry_up: 
    ts_hurry_up: 
      action: set
      int: 1

  training_select_left: 
    ts_last_move: 
      action: set
      string: "left"

  training_select_right: 
    ts_last_move: 
      action: set
      string: "right"




