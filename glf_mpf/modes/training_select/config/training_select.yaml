#config_version=6

mode:
  start_events: start_training_select
  stop_events: mode_base_stopping, stop_training_select
  priority: 600

event_player: 
  mode_training_select_started:
    - enable_scoop_hold
    - stop_training_qualify
    - show_training_completed_shots
  mode_training_select_started{current_player.training_heal_achieved==1}:
    - show_heal_completed
  mode_training_select_started{current_player.training_cluster_bomb_achieved==1}:
    - show_cluster_bomb_completed
  mode_training_select_started{current_player.training_proton_cannon_achieved==1}:
    - show_proton_cannon_completed
  mode_training_select_started{current_player.training_moon_missile_achieved==1}:
    - show_moon_missile_completed
  mode_training_select_started{current_player.training_ship_save_achieved==1}:
    - show_ship_save_completed
  mode_training_select_started{current_player.training_shields_achieved==1}:
    - show_shields_completed
  s_LeftFlipperButton_active:
    - training_select_left
  s_RightFlipperButton_active:
    - training_select_right
  s_LeftMagnaButton_active:
    - make_selection
  s_RightMagnaButton_active:
    - make_selection
  s_lockbar_key_active:
    - make_selection
  timer_training_select_complete:
    - make_selection
  make_selection:
    - release_scoop_hold
  release_scoop_hold:
    - disable_scoop_hold
  timer_training_select_tick{device.timers.training_select.ticks == 3}:
    - selection_hurry_up
  make_selection{device.state_machines.training_select.state=="heal"}:
    - start_training_heal
    - stopping_training_select
  make_selection{device.state_machines.training_select.state=="cluster_bomb"}:
    - start_training_cluster_bomb
    - stopping_training_select
  make_selection{device.state_machines.training_select.state=="proton_cannon"}:
    - start_training_proton_cannon
    - stopping_training_select
  make_selection{device.state_machines.training_select.state=="moon_missile"}:
    - start_training_moon_missile
    - stopping_training_select
  make_selection{device.state_machines.training_select.state=="ship_save"}:
    - start_training_ship_save
    - stopping_training_select
  make_selection{device.state_machines.training_select.state=="shields"}:
    - start_training_shields
    - stopping_training_select
  make_selection{device.state_machines.training_select.state=="skip"}:
    - stop_training_select
    - stop_training
  stopping_training_select:
    - training_music_start
    - meteor_wave_music_stop
    - stop_training_select
  balldevice_moon_lock_ball_enter{device.ball_devices.moon_lock.balls > current_player.moon_launch_locked_balls}:
    - delayed_release_moon_ball
  check_ts_heal{current_player.ts_last_move=="left" and current_player.training_heal_achieved==1}:
    - training_select_left
  check_ts_heal{current_player.ts_last_move=="right" and current_player.training_heal_achieved==1}:
    - training_select_right
  check_ts_cluster_bomb{current_player.ts_last_move=="left" and current_player.training_cluster_bomb_achieved==1}:
    - training_select_left
  check_ts_cluster_bomb{current_player.ts_last_move=="right" and current_player.training_cluster_bomb_achieved==1}:
    - training_select_right
  check_ts_proton_cannon{current_player.ts_last_move=="left" and current_player.training_proton_cannon_achieved==1}:
    - training_select_left
  check_ts_proton_cannon{current_player.ts_last_move=="right" and current_player.training_proton_cannon_achieved==1}:
    - training_select_right
  check_ts_moon_missile{current_player.ts_last_move=="left" and current_player.training_moon_missile_achieved==1}:
    - training_select_left
  check_ts_moon_missile{current_player.ts_last_move=="right" and current_player.training_moon_missile_achieved==1}:
    - training_select_right
  check_ts_ship_save{current_player.ts_last_move=="left" and current_player.training_ship_save_achieved==1}:
    - training_select_left
  check_ts_ship_save{current_player.ts_last_move=="right" and current_player.training_ship_save_achieved==1}:
    - training_select_right
  check_ts_shields{current_player.ts_last_move=="left" and current_player.training_shields_achieved==1}:
    - training_select_left
  check_ts_shields{current_player.ts_last_move=="right" and current_player.training_shields_achieved==1}:
    - training_select_right
  show_training_completed_shots{current_player.shot_training_health1==1}:
    - heal_1_completed
  show_training_completed_shots{current_player.shot_training_health2==1}:
    - heal_2_completed
  show_training_completed_shots{current_player.shot_training_health3==1}:
    - heal_3_completed
  show_training_completed_shots{current_player.shot_training_health4==1}:
    - heal_4_completed
  show_training_completed_shots{current_player.shot_training_health5==1}:
    - heal_5_completed
  show_training_completed_shots{current_player.shot_training_health6==1}:
    - heal_6_completed
  show_training_completed_shots{current_player.shot_training_health7==1}:
    - heal_7_completed
  show_training_completed_shots{current_player.shot_training_health8==1}:
    - heal_8_completed
  show_training_completed_shots{current_player.shot_training_health9==1}:
    - heal_9_completed
  show_training_completed_shots{current_player.shot_training_cluster_charge1==1}:
    - cluster_bomb_1_completed
  show_training_completed_shots{current_player.shot_training_cluster_charge2==1}:
    - cluster_bomb_2_completed
  show_training_completed_shots{current_player.shot_training_cluster_charge3==1}:
    - cluster_bomb_3_completed
  show_training_completed_shots{current_player.shot_training_proton_charge1==1}:
    - proton_cannon_1_completed
  show_training_completed_shots{current_player.shot_training_proton_charge2==1}:
    - proton_cannon_2_completed
  show_training_completed_shots{current_player.shot_training_proton_charge3==1}:
    - proton_cannon_3_completed
  show_training_completed_shots{current_player.shot_training_moon_lane1==1}:
    - moon_missile_1_completed
  show_training_completed_shots{current_player.shot_training_moon_lane2==1}:
    - moon_missile_2_completed
  show_training_completed_shots{current_player.shot_training_moon_lane3==1}:
    - moon_missile_3_completed
  show_training_completed_shots{current_player.shot_training_moon_lane4==1}:
    - moon_missile_4_completed
  show_training_completed_shots{current_player.shot_training_ship_charge1==1}:
    - ship_save_1_completed
  show_training_completed_shots{current_player.shot_training_ship_charge2==1}:
    - ship_save_2_completed
  show_training_completed_shots{current_player.shot_training_ship_charge3==1}:
    - ship_save_3_completed
  show_training_completed_shots{current_player.shot_training_shield_charge1==1}:
    - shields_1_completed
  show_training_completed_shots{current_player.shot_training_shield_charge2==1}:
    - shields_2_completed
  show_training_completed_shots{current_player.shot_training_shield_charge3==1}:
    - shields_3_completed


