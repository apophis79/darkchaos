  training_music_start: 
    events:
      training_music_1_start: 1
      training_music_2_start: 1
      training_music_3_start: 1
      training_music_4_start: 1
      training_music_5_start: 1
    scope: player


segment_display_player: 
  mode_training_select_started: 
    player1: 
      text: " "
      flashing: off
    player2: 
      text: "SELECT"
      flashing: off
    player4: 
      text: " "
      flashing: off

  heal_selected{current_player.training_heal_achieved==0}: 
    player3: 
      text: "HEAL "
      flashing: off

  cluster_bomb_selected{current_player.training_cluster_bomb_achieved==0}: 
    player3: 
      text: "CLUSTER"
      flashing: off

  proton_cannon_selected{current_player.training_proton_cannon_achieved==0}: 
    player3: 
      text: "PROTON"
      flashing: off

  moon_missile_selected{current_player.training_moon_missile_achieved==0}: 
    player3: 
      text: "MOON "
      flashing: off

  ship_save_selected{current_player.training_ship_save_achieved==0}: 
    player3: 
      text: "SAVER "
      flashing: off

  shields_selected{current_player.training_shields_achieved==0}: 
    player3: 
      text: "SHIELDS"
      flashing: off

  skip_selected: 
    player3: 
      text: "SKIP "
      flashing: off


shots: 
  select_heal:
    profile: training_select
    restart_events: heal_unselected, make_selection
    show_tokens: 
      lights: "tHeal"
      color: "00dd00"
    control_events: 
      - events: heal_selected{current_player.ts_hurry_up==0}
        state: 1
      - events: heal_selected{current_player.ts_hurry_up==1}, selection_hurry_up{device.state_machines.training_select.state=="heal"}
        state: 2
  select_cluster_bomb:
    profile: training_select
    restart_events: cluster_bomb_unselected, make_selection
    show_tokens: 
      lights: "tClusterAll"
      color: "dd00dd"
    control_events: 
      - events: cluster_bomb_selected{current_player.ts_hurry_up==0}
        state: 1
      - events: cluster_bomb_selected{current_player.ts_hurry_up==1}, selection_hurry_up{device.state_machines.training_select.state=="cluster_bomb"}
        state: 2
  select_proton_cannon:
    profile: training_select
    restart_events: proton_cannon_unselected, make_selection
    show_tokens: 
      lights: "tProtonAll"
      color: "00dddd"
    control_events: 
      - events: proton_cannon_selected{current_player.ts_hurry_up==0}
        state: 1
      - events: proton_cannon_selected{current_player.ts_hurry_up==1}, selection_hurry_up{device.state_machines.training_select.state=="proton_cannon"}
        state: 2
  select_moon_missile:
    profile: training_select
    restart_events: moon_missile_unselected, make_selection
    show_tokens: 
      lights: "tMoonAll"
      color: "ccbb00"
    control_events: 
      - events: moon_missile_selected{current_player.ts_hurry_up==0}
        state: 1
      - events: moon_missile_selected{current_player.ts_hurry_up==1}, selection_hurry_up{device.state_machines.training_select.state=="moon_missile"}
        state: 2
  select_ship_save:
    profile: training_select
    restart_events: ship_save_unselected, make_selection
    show_tokens: 
      lights: "tSaver"
      color: "0500ee"
    control_events: 
      - events: ship_save_selected{current_player.ts_hurry_up==0}
        state: 1
      - events: ship_save_selected{current_player.ts_hurry_up==1}, selection_hurry_up{device.state_machines.training_select.state=="ship_save"}
        state: 2
  select_shields:
    profile: training_select
    restart_events: shields_unselected, make_selection
    show_tokens: 
      lights: "tShields"
      color: "0010cc"
    control_events: 
      - events: shields_selected{current_player.ts_hurry_up==0}
        state: 1
      - events: shields_selected{current_player.ts_hurry_up==1}, selection_hurry_up{device.state_machines.training_select.state=="shields"}
        state: 2

show_player: 
  mode_training_select_started: 
    flash_color_with_fade: 
      key: key_ts_gi
      speed: 2
      show_tokens: 
        lights: "GI"
        fade: "900"
        color: "ffedd2"
  skip_selected: 
    flash_color: 
      key: key_skip_gi
      priority: 100
      speed: 11
      show_tokens: 
        lights: "gi22"
        color: "ffffff"
  skip_unselected: 
    flash_color: 
      action: stop
      key: key_skip_gi
      speed: 13
      show_tokens: 
        lights: "gi22"
        color: "ffffff"


slide_player: 
  mode_training_select_started.1: 
    training_select:
      action: play
      expire: 0s


sound_player: 
  mode_training_select_started: 
    voc_select_option: 
      key: key_voc_select_option
      action: play


state_machines: 
  training_select:
    starting_state: init
    states: 
      init: 
        label: Init State
        events_when_started: training_select_init
      heal: 
        label: Select Heal State
        events_when_started: heal_selected, show_training_completed_shots, check_ts_heal
      cluster_bomb: 
        label: Select Cluster Bomb State
        events_when_started: cluster_bomb_selected, show_training_completed_shots, check_ts_cluster_bomb
      proton_cannon: 
        label: Select Proton Cannon State
        events_when_started: proton_cannon_selected, show_training_completed_shots, check_ts_proton_cannon
      moon_missile: 
        label: Select Moon Missile State
        events_when_started: moon_missile_selected, show_training_completed_shots, check_ts_moon_missile
      ship_save: 
        label: Select Ship Save State
        events_when_started: ship_save_selected, show_training_completed_shots, check_ts_ship_save
      shields: 
        label: Select Shields State
        events_when_started: shields_selected, show_training_completed_shots, check_ts_shields
      skip: 
        label: Skip State
        events_when_started: skip_selected, show_training_completed_shots
    transitions: 
      - source: init
        target: heal
        events: 
          - training_select_init
      - source: heal
        target: cluster_bomb
        events: 
          - training_select_right
        events_when_transitioning: heal_unselected
      - source: cluster_bomb
        target: proton_cannon
        events: 
          - training_select_right
        events_when_transitioning: cluster_bomb_unselected
      - source: proton_cannon
        target: ship_save
        events: 
          - training_select_right
        events_when_transitioning: proton_cannon_unselected
      - source: ship_save
        target: shields
        events: 
          - training_select_right
        events_when_transitioning: ship_save_unselected
      - source: shields
        target: moon_missile
        events: 
          - training_select_right
        events_when_transitioning: shields_unselected
      - source: moon_missile
        target: skip
        events: 
          - training_select_right
        events_when_transitioning: moon_missile_unselected
      - source: skip
        target: heal
        events: 
          - training_select_right
        events_when_transitioning: skip_unselected
      - source: heal
        target: skip
        events: 
          - training_select_left
        events_when_transitioning: heal_unselected
      - source: cluster_bomb
        target: heal
        events: 
          - training_select_left
        events_when_transitioning: cluster_bomb_unselected
      - source: proton_cannon
        target: cluster_bomb
        events: 
          - training_select_left
        events_when_transitioning: proton_cannon_unselected
      - source: ship_save
        target: proton_cannon
        events: 
          - training_select_left
        events_when_transitioning: ship_save_unselected
      - source: shields
        target: ship_save
        events: 
          - training_select_left
        events_when_transitioning: shields_unselected
      - source: moon_missile
        target: shields
        events: 
          - training_select_left
        events_when_transitioning: moon_missile_unselected
      - source: skip
        target: moon_missile
        events: 
          - training_select_left
        events_when_transitioning: skip_unselected

timers: 
  training_select:
    start_value: 10
    end_value: 0
    direction: down
    control_events: 
      - event: mode_training_select_started
        action: restart
    restart_on_complete: False
    start_running: False
    tick_interval: 1000ms

variable_player: 
  timer_training_select_tick: 
    selection_countdown_value: 
      action: set
      int: {device.timers.training_select.ticks}

  mode_training_select_started: 
    selection_countdown_value: 
      action: set
      int: 10
    ts_hurry_up: 
      action: set
      int: 0
    ts_last_move: 
      action: set
      string: "right"

  selection_hurry_up: 
    ts_hurry_up: 
      action: set
      int: 1

  training_select_left: 
    ts_last_move: 
      action: set
      string: "left"

  training_select_right: 
    ts_last_move: 
      action: set
      string: "right"




