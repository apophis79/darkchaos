    restart_events: proton_cannon_unselected, make_selection
    show_tokens: 
      lights: "tProtonAll"
      color: "00dddd"
    control_events: 
      - events: proton_cannon_selected{current_player.ts_hurry_up==0}
        state: 1
      - events: proton_cannon_selected{current_player.ts_hurry_up==1}, selection_hurry_up{device.state_machines.training_select.state=="proton_cannon"}
