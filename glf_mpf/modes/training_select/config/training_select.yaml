#config_version=6

mode:
  start_events: start_training_select
  stop_events: mode_base_stopping, stop_training_select
  priority: 600

event_player: 
  mode_training_select_started:
    - enable_scoop_hold
  s_LeftFlipperButton_active:
    - training_select_left
  s_RightFlipperButton_active:
    - training_select_right
  s_LeftMagnaButton_active:
    - make_selection
  s_RightMagnaButton_active:
    - make_selection
  s_lockbar_key_active:
    - make_selection
  timer_training_select_complete:
    - make_selection
  make_selection:
    - release_scoop_hold
    - start_training
  release_scoop_hold:
    - disable_scoop_hold
  timer_training_select_tick{device.timers.training_select.ticks == 7}:
    - selection_hurry_up
  make_selection{device.state_machines.training_select.state=="heal"}:
    - start_training_heal
    - stopping_training_select
  make_selection{device.state_machines.training_select.state=="cluster_bomb"}:
    - start_training_cluster_bomb
    - stopping_training_select
  make_selection{device.state_machines.training_select.state=="proton_cannon"}:
    - start_training_proton_cannon
    - stopping_training_select
  make_selection{device.state_machines.training_select.state=="moon_missile"}:
    - start_training_moon_missile
    - stopping_training_select
  make_selection{device.state_machines.training_select.state=="ship_save"}:
    - start_training_ship_save
    - stopping_training_select
  make_selection{device.state_machines.training_select.state=="shields"}:
    - start_training_shields
    - stopping_training_select
  make_selection{device.state_machines.training_select.state=="skip"}:
    - stop_training_select
    - stop_training
  stopping_training_select:
    - training_music_start
    - meteor_wave_music_stop
    - stop_training_select
  balldevice_moon_lock_ball_enter{device.ball_devices.moon_lock.balls > current_player.moon_launch_locked_balls}:
    - delayed_release_moon_ball


random_event_player: 
  training_music_start: 
    events:
      training_music_1_start: 1
      training_music_2_start: 1
      training_music_3_start: 1
      training_music_4_start: 1
      training_music_5_start: 1
    scope: player


segment_display_player: 
  mode_training_select_started: 
    player1: 
      text: " "
      flashing: off
    player2: 
      text: "SELECT"
      flashing: off
    player4: 
      text: " "
      flashing: off

  heal_selected{current_player.training_heal_achieved==0}: 
    player3: 
      text: "HEAL "
      flashing: off

  cluster_bomb_selected{current_player.training_cluster_bomb_achieved==0}: 
    player3: 
      text: "CLUSTER"
      flashing: off

  proton_cannon_selected{current_player.training_proton_cannon_achieved==0}: 
    player3: 
      text: "PROTON"
      flashing: off

  moon_missile_selected{current_player.training_moon_missile_achieved==0}: 
    player3: 
      text: "MOON "
      flashing: off

  ship_save_selected{current_player.training_ship_save_achieved==0}: 
    player3: 
      text: "SAVER "
      flashing: off

  shields_selected{current_player.training_shields_achieved==0}: 
    player3: 
      text: "SHIELDS"
      flashing: off

  skip_selected: 
    player3: 
      text: "SKIP "
      flashing: off


