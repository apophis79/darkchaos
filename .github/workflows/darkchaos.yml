name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    outputs:
      build_number: ${{ steps.version.outputs.build_number }}

    steps:
      # --------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # --------------------------------------------------
      # GAME / VERSION
      # --------------------------------------------------

      - name: Read Game Name from File
        id: gamename
        run: |
          $game_name = Get-Content gamename.txt | Select-Object -First 1
          echo "game_name=$game_name" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Set Build Number from GitHub Run
        id: version
        run: |
          echo "build_number=${{ github.run_number }}" >> $env:GITHUB_OUTPUT
        shell: pwsh


      # --------------------------------------------------
      # BUILD VPX SCRIPT
      # --------------------------------------------------

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 16

      - name: Install Grunt CLI
        run: npm install -g grunt-cli
        shell: pwsh

      - name: Run Grunt to Concat VPX Files and Set Production Mode
        run: |
          cd scripts

          npm install
          grunt concat:prod

          # Replace production mode
          $lines = Get-Content dest/vpx/tablescript.vbs

          $lines = $lines | ForEach-Object {
            if ($_ -eq 'Dim glf_production_mode : glf_production_mode = False') {
              'Dim glf_production_mode : glf_production_mode = True'
            } else {
              $_
            }
          }

          # Replace function count
          $lines = $lines | ForEach-Object {
            if ($_ -eq 'Dim glf_FuncCount : glf_FuncCount = 0') {
              'Dim glf_FuncCount : glf_FuncCount = 9999'
            } else {
              $_
            }
          }

          $lines | Set-Content dest/vpx/tablescript.vbs

          # Move modified script into game folder
          Move-Item `
            -Path dest/vpx/tablescript.vbs `
            -Destination ../${{ steps.gamename.outputs.game_name }}/script.vbs `
            -Force
        shell: pwsh


      # --------------------------------------------------
      # LOCK GAMEDATA
      # --------------------------------------------------

      - name: Install jq
        run: |
          choco install jq -y
        shell: pwsh

      - name: Modify Locked Property in JSON
        run: |
          jq '.locked = 1' ${{ steps.gamename.outputs.game_name }}/gamedata.json > temp.json
          mv temp.json ${{ steps.gamename.outputs.game_name }}/gamedata.json
        shell: bash


      # --------------------------------------------------
      # BUILD VPX
      # --------------------------------------------------

      - name: Download vpxtool
        run: |
          Invoke-WebRequest `
            -Uri https://github.com/francisdb/vpxtool/releases/download/v0.35.1/vpxtool-Windows-x86_64-v0.35.1.zip `
            -OutFile vpxtool.zip

          Expand-Archive vpxtool.zip -DestinationPath .\vpxtool
        shell: pwsh

      - name: Assemble VPX File
        run: |
          .\vpxtool\vpxtool.exe assemble ${{ steps.gamename.outputs.game_name }}

          Rename-Item `
            -Path .\${{ steps.gamename.outputs.game_name }}.vpx `
            -NewName "${{ steps.gamename.outputs.game_name }}${{ steps.version.outputs.build_number }}.vpx"
        shell: pwsh


      # --------------------------------------------------
      # CHECK FOR GODOT
      # --------------------------------------------------

      - name: Check for Godot Project Folder
        id: check_godot
        run: |
          if (Test-Path ".\godot\${{ steps.gamename.outputs.game_name }}-gmcdisplay") {
            echo "exists=true" >> $env:GITHUB_OUTPUT
          } else {
            echo "exists=false" >> $env:GITHUB_OUTPUT
          }
        shell: pwsh


      # --------------------------------------------------
      # NON-GODOT GAME
      # --------------------------------------------------

      - name: Upload VPX Artifact
        if: steps.check_godot.outputs.exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.gamename.outputs.game_name }}_${{ steps.version.outputs.build_number }}
          path: ./${{ steps.gamename.outputs.game_name }}${{ steps.version.outputs.build_number }}.vpx


      # --------------------------------------------------
      # DOWNLOAD GODOT
      # --------------------------------------------------

      - name: Download Godot 4.6.2
        if: steps.check_godot.outputs.exists == 'true'
        run: |
          Invoke-WebRequest `
            -Uri https://github.com/godotengine/godot/releases/download/4.6.2-stable/Godot_v4.6.2-stable_win64.exe.zip `
            -OutFile godot.zip

          Expand-Archive godot.zip -DestinationPath godot_engine
        shell: pwsh

      - name: Download and Extract Godot 4.6.2 Export Templates
        if: steps.check_godot.outputs.exists == 'true'
        run: |
          $target = "$env:APPDATA\Godot\export_templates\4.6.2.stable"
          $temp = "temp_templates"

          Invoke-WebRequest `
            -Uri https://github.com/godotengine/godot/releases/download/4.6.2-stable/Godot_v4.6.2-stable_export_templates.tpz `
            -OutFile templates.tpz

          New-Item -ItemType Directory -Force -Path $temp | Out-Null
          New-Item -ItemType Directory -Force -Path $target | Out-Null

          tar -xf templates.tpz -C $temp

          Move-Item "$temp/templates/*" $target -Force

          Remove-Item $temp -Recurse -Force
        shell: pwsh


      # --------------------------------------------------
      # EXPORT GODOT - WINDOWS
      # --------------------------------------------------

      - name: Export Godot - Windows
        if: steps.check_godot.outputs.exists == 'true'
        run: |
          New-Item -ItemType Directory -Force -Path godot_builds | Out-Null

          $gameName = "${{ steps.gamename.outputs.game_name }}"
          $tableName = $gameName -replace '-Dev$', ''

          $projectPath = ".\godot\$gameName-gmcdisplay"
          $godot = ".\godot_engine\Godot_v4.6.2-stable_win64.exe"

          $buildDir = (Resolve-Path ".\godot_builds").Path
          $output = "$buildDir\${tableName}_gmc.exe"

          Write-Host "Exporting Windows build to $output"

          & $godot `
            --headless `
            --path $projectPath `
            --export-release "Windows Desktop" `
            $output `
            2>&1 | Tee-Object -FilePath godot_windows_export.log

          if (!(Test-Path $output)) {
            Write-Host "Windows export failed."
            Get-Content godot_windows_export.log
            exit 1
          }

          Write-Host "Windows export succeeded:"
          Get-Item $output
        shell: pwsh


      # --------------------------------------------------
      # EXPORT GODOT - LINUX
      # --------------------------------------------------

      - name: Export Godot - Linux
        if: steps.check_godot.outputs.exists == 'true'
        run: |
          $gameName = "${{ steps.gamename.outputs.game_name }}"
          $tableName = $gameName -replace '-Dev$', ''

          $projectPath = ".\godot\$gameName-gmcdisplay"
          $godot = ".\godot_engine\Godot_v4.6.2-stable_win64.exe"

          $buildDir = (Resolve-Path ".\godot_builds").Path
          $output = "$buildDir\${tableName}_gmc.x86_64"

          Write-Host "Exporting Linux build to $output"

          & $godot `
            --headless `
            --path $projectPath `
            --export-release "Linux" `
            $output `
            2>&1 | Tee-Object -FilePath godot_linux_export.log

          if (!(Test-Path $output)) {
            Write-Host "Linux export failed."
            Get-Content godot_linux_export.log
            exit 1
          }

          Write-Host "Linux export succeeded:"
          Get-Item $output
        shell: pwsh


      # --------------------------------------------------
      # EXPORT GODOT - MACOS
      # --------------------------------------------------

      - name: Export Godot - macOS
        if: steps.check_godot.outputs.exists == 'true'
        run: |
          $gameName = "${{ steps.gamename.outputs.game_name }}"
          $tableName = $gameName -replace '-Dev$', ''

          $projectPath = ".\godot\$gameName-gmcdisplay"
          $projectFile = "$projectPath\project.godot"

          $godot = ".\godot_engine\Godot_v4.6.2-stable_win64.exe"

          $buildDir = (Resolve-Path ".\godot_builds").Path
          $output = "$buildDir\${tableName}_gmc.zip"

          # --------------------------------------------------
          # Set the macOS application bundle name.
          #
          # Example:
          #
          # DarkChaos_gmc.zip
          #   └── DarkChaos_gmc.app
          #
          # The base Godot project name is left unchanged.
          # --------------------------------------------------

          $macAppName = "${tableName}_gmc"

          Write-Host "Setting macOS application name to: $macAppName"

          if (!(Test-Path $projectFile)) {
            Write-Host "project.godot not found: $projectFile"
            exit 1
          }

          $content = Get-Content $projectFile

          # Replace existing macOS override if one already exists.
          if ($content -match '^config/name\.macos=') {

            $content = $content | ForEach-Object {
              if ($_ -match '^config/name\.macos=') {
                "config/name.macos=`"$macAppName`""
              } else {
                $_
              }
            }

          } else {

            # Insert macOS override immediately after config/name.
            $newContent = @()
            $inserted = $false

            foreach ($line in $content) {
              $newContent += $line

              if (!$inserted -and $line -match '^config/name=') {
                $newContent += "config/name.macos=`"$macAppName`""
                $inserted = $true
              }
            }

            if (!$inserted) {
              Write-Host "Could not find config/name in project.godot"
              exit 1
            }

            $content = $newContent
          }

          $content | Set-Content $projectFile

          Write-Host "macOS application configuration:"
          Get-Content $projectFile | Select-String "config/name"

          Write-Host "Exporting macOS build to $output"

          & $godot `
            --headless `
            --path $projectPath `
            --export-release "macOS" `
            $output `
            2>&1 | Tee-Object -FilePath godot_macos_export.log

          if (!(Test-Path $output)) {
            Write-Host "macOS export failed."
            Get-Content godot_macos_export.log
            exit 1
          }

          Write-Host "macOS export succeeded:"
          Get-Item $output
        shell: pwsh


      # --------------------------------------------------
      # CREATE PLATFORM RELEASE DIRECTORIES
      # --------------------------------------------------

      - name: Create Platform Release Folders
        if: steps.check_godot.outputs.exists == 'true'
        run: |
          $gameName = "${{ steps.gamename.outputs.game_name }}"
          $tableName = $gameName -replace '-Dev$', ''
          $buildNumber = "${{ steps.version.outputs.build_number }}"

          $windowsDir = "release\windows"
          $linuxDir   = "release\linux"
          $macDir     = "release\macos"

          New-Item -ItemType Directory -Force -Path $windowsDir | Out-Null
          New-Item -ItemType Directory -Force -Path $linuxDir | Out-Null
          New-Item -ItemType Directory -Force -Path $macDir | Out-Null


          # --------------------------------------------------
          # FUNCTION: COPY SHARED GAME FILES
          # --------------------------------------------------

          function Copy-SharedFiles {
            param(
              [string]$Destination
            )

            # VPX
            Copy-Item `
              "${gameName}${buildNumber}.vpx" `
              -Destination $Destination


            # DirectB2S - optional
            if (Test-Path "${gameName}.directb2s") {
              Copy-Item `
                "${gameName}.directb2s" `
                -Destination $Destination
            }


            # Default INI - optional
            if (Test-Path "default_ini_settings.txt") {
              $iniName = "${gameName}${buildNumber}.ini"

              Copy-Item `
                "default_ini_settings.txt" `
                -Destination (Join-Path $Destination $iniName)
            }


            # BCP Controller
            if (Test-Path "bcp-controller") {
              Copy-Item `
                "bcp-controller" `
                -Destination (Join-Path $Destination "bcp-controller") `
                -Recurse `
                -Force
            }
          }


          # --------------------------------------------------
          # WINDOWS PACKAGE
          # --------------------------------------------------

          Copy-SharedFiles $windowsDir

          Copy-Item `
            "godot_builds\${tableName}_gmc.exe" `
            -Destination $windowsDir


          # --------------------------------------------------
          # LINUX PACKAGE
          # --------------------------------------------------

          Copy-SharedFiles $linuxDir

          Copy-Item `
            "godot_builds\${tableName}_gmc.x86_64" `
            -Destination $linuxDir


          # --------------------------------------------------
          # MACOS PACKAGE
          # --------------------------------------------------

          Copy-SharedFiles $macDir

          Copy-Item `
            "godot_builds\${tableName}_gmc.zip" `
            -Destination $macDir


          # --------------------------------------------------
          # DISPLAY FINAL PACKAGES
          # --------------------------------------------------

          Write-Host ""
          Write-Host "Windows package:"
          Get-ChildItem -Recurse $windowsDir

          Write-Host ""
          Write-Host "Linux package:"
          Get-ChildItem -Recurse $linuxDir

          Write-Host ""
          Write-Host "macOS package:"
          Get-ChildItem -Recurse $macDir
        shell: pwsh


      # --------------------------------------------------
      # UPLOAD WINDOWS ARTIFACT
      # --------------------------------------------------

      - name: Upload Windows Build
        if: steps.check_godot.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.gamename.outputs.game_name }}_${{ steps.version.outputs.build_number }}_Windows
          path: release/windows/
          if-no-files-found: error


      # --------------------------------------------------
      # UPLOAD LINUX ARTIFACT
      # --------------------------------------------------

      - name: Upload Linux Build
        if: steps.check_godot.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.gamename.outputs.game_name }}_${{ steps.version.outputs.build_number }}_Linux
          path: release/linux/
          if-no-files-found: error


      # --------------------------------------------------
      # UPLOAD MACOS ARTIFACT
      # --------------------------------------------------

      - name: Upload macOS Build
        if: steps.check_godot.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.gamename.outputs.game_name }}_${{ steps.version.outputs.build_number }}_macOS
          path: release/macos/
          if-no-files-found: error
